name: Release notes

# Riallinea le note delle release dell'app alle sezioni di CHANGELOG.md a ogni push su main che lo cambia
# (.github/scripts/sync-release-notes.sh): le voci aggiunte dopo un rilascio, come i cambiamenti
# incompatibili emersi piu' tardi, arrivano anche nelle release gia' pubblicate senza modifiche a mano.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Una alla volta, e la piu' recente vince: legge sempre il CHANGELOG.md del suo commit.
    concurrency:
      group: release-notes
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Note delle release dal changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/sync-release-notes.sh
