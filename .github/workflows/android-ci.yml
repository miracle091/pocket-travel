name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# git legge la configurazione anche dall'ambiente: niente suggerimento "Using 'master' as the name for the initial
# branch" in ogni checkout.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Un nuovo push sulla stessa PR annulla la run precedente; su main ogni push completa la sua.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stesso JDK del daemon Gradle (toolchainVersion in gradle/gradle-daemon-jvm.properties): con
      # un JDK diverso Gradle ne scaricherebbe un secondo a ogni run. Stessa versione negli altri workflow.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # llama.cpp (feature/ai, CMake per arm64-v8a e x86_64) si compila da zero a ogni run, circa 8-10 minuti sul
      # percorso critico. Il CMakeLists di feature/ai usa ccache se c'e', con gli oggetti ripristinati
      # dalla cache. La chiave segue sorgenti, patch, CMakeLists e build.gradle.kts di
      # feature/ai (argomenti CMake, ABI, versione dell'NDK); senza
      # corrispondenza esatta si riparte dalla cache piu' recente e si ricompilano solo i file cambiati.
      # Il controllo del compilatore usa la versione dell'NDK (ndkVersion di feature/ai/build.gradle.kts, letta nel passo) e non
      # la data del file, che cambierebbe se l'NDK venisse reinstallato. Mai bloccante.
      - name: Installa ccache
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq ccache
          echo "CCACHE_COMPILERCHECK=string:ndk-$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' feature/ai/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Cache di ccache per llama.cpp
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ccache
          key: ccache-llama-${{ hashFiles('third-party/llama-cpp/**', 'third-party/patches/llama-cpp/**', 'feature/ai/src/main/cpp/**', 'feature/ai/build.gradle.kts') }}
          restore-keys: ccache-llama-

      # Le modifiche locali ai third-party stanno come patch in third-party/patches: dopo un aggiornamento
      # del vendor vanno riapplicate (quelle di llama-cpp le riapplica il CMake di feature/ai, quelle di
      # brouter-core si applicano a mano). Prima del build, cosi' controlla il codice com'e' nel commit.
      - name: Patch dei third-party applicate
        shell: bash
        run: |
          set -e
          for p in third-party/patches/*/*.patch; do
            git apply --reverse --check "$p" || { echo "$p non e' applicata: git apply $p, o rifarla" >&2; exit 1; }
          done

      - run: ./gradlew assembleDebug lint detekt testDebugUnitTest :core:poi:test :tools:data-pipeline:content:test --no-daemon

      # Tutti i test Python della pipeline e degli script dei workflow: un test nuovo (test_*.py) viene eseguito senza
      # toccare il workflow. Un file o una connessione lasciati aperti (ResourceWarning) fanno fallire il passo: Python li
      # segnala solo come avviso, anche con -W error.
      - name: Test Python della pipeline
        shell: bash
        run: |
          set -e
          for t in tools/data-pipeline/scripts/test_*.py .github/scripts/test_*.py; do
            echo "== $t"
            python3 -W always::ResourceWarning "$t" 2>&1 | tee "$RUNNER_TEMP/python-test.log"
            if grep -q ResourceWarning "$RUNNER_TEMP/python-test.log"; then
              echo "::error::$t lascia file o connessioni aperti (ResourceWarning)"
              exit 1
            fi
          done

      # Vulnerabilita' note (OSV) nelle dipendenze risolte di app e pipeline: un errore fa fallire il job. Le
      # versioni piu' nuove sono solo note (::notice::); se OSV o i repository non rispondono e' un avviso.
      - name: Dipendenze senza vulnerabilita' note
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -q --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/app.txt"
          ./gradlew -q --no-daemon :tools:data-pipeline:content:dependencies --configuration runtimeClasspath > "$RUNNER_TEMP/pipeline.txt"
          python3 .github/scripts/check-dependencies.py "$RUNNER_TEMP/app.txt" "$RUNNER_TEMP/pipeline.txt"

      # Gli script di pubblicazione leggono la chiave pubblica da SyncConfig.kt: se il sorgente cambia forma, la
      # verifica di app-status.json fallisce, e nei job di pubblicazione questo si vede solo al rilascio. Qui
      # si verifica il file pubblicato a ogni push, con lo stesso script.
      - name: Firma di app-status.json verificabile con la chiave dell'app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          retry gh release download app-status --pattern 'app-status.json*' --dir "$RUNNER_TEMP/app-status" \
            --repo "$GITHUB_REPOSITORY"
          bash .github/scripts/verify-app-status.sh "$RUNNER_TEMP/app-status/app-status.json"

      # weekly-schedule.sh e' generato da regions.sh (generate-weekly-schedule.sh): se non e'
      # stato rigenerato dopo una modifica all'elenco, una regione nuova non verrebbe mai pubblicata
      # dallo schedule (o una tolta verrebbe ancora chiesta). Ogni regione una e una sola volta.
      - name: Calendario settimanale allineato a regions.sh
        shell: bash
        run: |
          set -euo pipefail
          source tools/data-pipeline/scripts/regions.sh
          source tools/data-pipeline/scripts/weekly-schedule.sh
          if ! diff <(for spec in "${ALL_REGIONS[@]}"; do echo "${spec%%|*}"; done | sort) \
            <(for d in 1 2 3 4 5 6 7; do v="WEEKLY_SCHEDULE_DAY_$d"; tr ',' '\n' <<< "${!v}"; done | sort); then
            echo "weekly-schedule.sh non corrisponde a regions.sh (< solo nell'elenco, > solo nel calendario o ripetute): rilanciare generate-weekly-schedule.sh" >&2
            exit 1
          fi

      # APK di debug per le prove: e' debuggabile (adb run-as, debugger), quindi chi ha accesso al dispositivo puo' leggere
      # dall'interno dell'app note e chiave API. Il nome lo dice, e l'artifact resta solo 7 giorni; per l'uso vero c'e'
      # l'APK di release firmato (publish-apk).
      - name: Carica l'APK di debug come artifact con nome eloquente
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          SHA="${GITHUB_SHA::7}"
          NAME="pocket-travel-debug-v${VERSION}-${SHA}-SOLO-PROVE-non-usare-con-dati-veri.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$NAME"
          echo "DEBUG_APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "DEBUG_APK_PATH=$RUNNER_TEMP/$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: ${{ env.DEBUG_APK_NAME }}
          path: ${{ env.DEBUG_APK_PATH }}
          retention-days: 7

  # Test su emulatore (Compose, percorsi di navigazione, migrazioni Room, installazione dei pacchetti), in parallelo al job
  # "build". Quelli che chiedono file sul dispositivo (modello GGUF, segmenti .rd5) qui si saltano da soli (assumeTrue).
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stesso JDK del job "build".
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # Cache di Gradle in sola lettura: la scrive solo il job "build" di android-ci.yml, che compila anche la
      # pipeline. Un salvataggio per job riempirebbe il limite di 10 GB delle cache del repository e farebbe
      # sfrattare le altre (dump, traduzioni, ccache).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # ccache per llama.cpp, come nel job "build" (stessa chiave: gli oggetti sono gli stessi), in sola lettura: la
      # salva solo il job "build" (due job sulla stessa chiave: "Unable to reserve cache" a ogni run).
      - name: Installa ccache
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq ccache
          echo "CCACHE_COMPILERCHECK=string:ndk-$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' feature/ai/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Cache di ccache per llama.cpp
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ccache
          key: ccache-llama-${{ hashFiles('third-party/llama-cpp/**', 'third-party/patches/llama-cpp/**', 'feature/ai/src/main/cpp/**', 'feature/ai/build.gradle.kts') }}
          restore-keys: ccache-llama-

      # Immagine di sistema dell'emulatore (~1,3 GB): senza cache sdkmanager la scarica a ogni run (~80 s). La chiave e'
      # fissa: va cambiata insieme ad api-level, target o arch qui sotto.
      - name: Cache dell'immagine di sistema dell'emulatore
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-system-image-34-google_apis-x86_64

      # Accelerazione hardware dell'emulatore x86_64 sui runner Linux.
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # android-emulator-runner installa la sua versione dei cmdline-tools con un mkdir che fallisce se la cartella c'e'
      # gia' (immagine ubuntu-24.04); adb nel PATH serve anche alla sua pulizia finale.
      - name: Prepara l'SDK per l'emulatore
        run: |
          sudo rm -rf "$ANDROID_HOME/cmdline-tools"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./gradlew connectedDebugAndroidTest --no-daemon
