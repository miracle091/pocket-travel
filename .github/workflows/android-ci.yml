name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un nuovo push sulla stessa PR annulla la run precedente; su main ogni push completa la sua.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stesso JDK del daemon Gradle (toolchainVersion in gradle/gradle-daemon-jvm.properties): con
      # un JDK diverso Gradle ne scaricherebbe un secondo a ogni run. Stessa versione negli altri workflow.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: ./gradlew assembleDebug lint detekt testDebugUnitTest :core:poi:test :tools:data-pipeline:content:test --no-daemon

      # Tutti i test Python della pipeline: un test nuovo (test_*.py) viene eseguito senza toccare il workflow.
      - name: Test Python della pipeline
        shell: bash
        run: |
          set -e
          for t in tools/data-pipeline/scripts/test_*.py; do echo "== $t"; python3 "$t"; done

      # weekly-schedule.sh e' generato da pilot-regions.sh (generate-weekly-schedule.sh): se non e'
      # stato rigenerato dopo una modifica all'elenco, una regione nuova non verrebbe mai pubblicata
      # dallo schedule (o una tolta verrebbe ancora chiesta). Ogni regione una e una sola volta.
      - name: Calendario settimanale allineato a pilot-regions.sh
        shell: bash
        run: |
          set -euo pipefail
          source tools/data-pipeline/scripts/pilot-regions.sh
          source tools/data-pipeline/scripts/weekly-schedule.sh
          if ! diff <(for spec in "${PILOT_REGIONS[@]}"; do echo "${spec%%|*}"; done | sort) \
            <(for d in 1 2 3 4 5 6 7; do v="WEEKLY_SCHEDULE_DAY_$d"; tr ',' '\n' <<< "${!v}"; done | sort); then
            echo "weekly-schedule.sh non corrisponde a pilot-regions.sh (< solo nell'elenco, > solo nel calendario o ripetute): rilanciare generate-weekly-schedule.sh" >&2
            exit 1
          fi

      - name: Carica l'APK di debug come artifact con nome eloquente
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          SHA="${GITHUB_SHA::7}"
          NAME="pocket-travel-debug-v${VERSION}-${SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$NAME"
          echo "DEBUG_APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "DEBUG_APK_PATH=$RUNNER_TEMP/$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: ${{ env.DEBUG_APK_NAME }}
          path: ${{ env.DEBUG_APK_PATH }}

  # Test su emulatore (Compose, rotte di navigazione, migrazioni Room, installazione dei pacchetti), in parallelo al job
  # "build". Quelli che chiedono file sul dispositivo (modello GGUF, segmenti .rd5) qui si saltano da soli (assumeTrue).
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stesso JDK del job "build".
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Accelerazione hardware dell'emulatore x86_64 sui runner Linux.
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # android-emulator-runner installa la sua versione dei cmdline-tools con un mkdir che fallisce se la cartella c'e'
      # gia' (immagine ubuntu-24.04); adb nel PATH serve anche alla sua pulizia finale.
      - name: Prepara l'SDK per l'emulatore
        run: |
          sudo rm -rf "$ANDROID_HOME/cmdline-tools"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --no-daemon
