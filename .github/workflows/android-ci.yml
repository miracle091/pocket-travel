name: Android CI

# Salta i push e le pull request che toccano solo documentazione (file .md, docs/): nessun build, test o passo li legge,
# tranne il test delle model card (test_render_cards.py legge tools/data-pipeline/model-cards/*.md), che resta nel
# filtro. Un elenco `paths` con esclusioni e non `paths-ignore`, perche' solo il primo permette di reincludere le card.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'tools/data-pipeline/model-cards/**'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'tools/data-pipeline/model-cards/**'

permissions:
  contents: read

# git legge la configurazione anche dall'ambiente: niente suggerimento "Using 'master' as the name for the initial
# branch" in ogni checkout.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Un nuovo push sulla stessa PR annulla la run precedente; su main ogni push completa la sua.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 400M
    steps:
      # llama.cpp e BRouter sono submodule (third-party/), scaricati solo al commit registrato.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # Stesso JDK del daemon Gradle (toolchainVersion in gradle/gradle-daemon-jvm.properties): con
      # un JDK diverso Gradle ne scaricherebbe un secondo a ogni run. Stessa versione negli altri workflow.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Heap del daemon a 3 GB solo in CI (gradle.properties ha 2 GB): con il parallelismo e i molti task KSP, 2 GB
      # hanno dato un classpath incompleto in :feature:ai:kspReleaseKotlin. Il gradle.properties della cartella
      # utente prevale su quello del progetto; gli altri argomenti di org.gradle.jvmargs restano quelli del progetto.
      - name: Memoria di Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=$(sed -n 's/^org.gradle.jvmargs=//p' gradle.properties | sed 's/-Xmx[0-9]*[mMgG]/-Xmx3g/')" >> "$HOME/.gradle/gradle.properties"

      # llama.cpp (feature/ai, CMake per arm64-v8a e x86_64) si compila da zero a ogni run, circa 8-10 minuti sul
      # percorso critico: l'azione ripristina gli oggetti compilati, che il CMakeLists di feature/ai usa tramite ccache.
      - name: ccache per llama.cpp
        id: ccache
        uses: ./.github/actions/setup-ccache-llama

      # Le modifiche del progetto ai third-party stanno come patch in third-party/patches, applicate dal build a una
      # copia dei submodule (CMake di feature/ai per llama.cpp, task brouterSources per BRouter). Qui, prima del build
      # e in pochi secondi, si controlla che si applichino ancora ai submodule puliti. Le patch passano a git apply come
      # un solo input, cosi' si controllano in sequenza come le applica il build (con piu' file, ognuno sul codice pulito).
      - name: Patch dei third-party applicabili
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for lib in llama-cpp brouter; do
            patches=(third-party/patches/"$lib"/*.patch)
            [ ${#patches[@]} -gt 0 ] || continue
            cat "${patches[@]}" | git -C "third-party/$lib" apply --check \
              || { echo "::error::una patch di third-party/patches/$lib non si applica al submodule: rifarla o toglierla" >&2; exit 1; }
          done
          # Una patch che si toglie al contrario dal submodule pulito e' gia' upstream: va solo tolta, il build non fallisce.
          for lib in llama-cpp brouter; do
            for patch in third-party/patches/"$lib"/*.patch; do
              if git -C "third-party/$lib" apply --check --reverse < "$patch" 2>/dev/null; then
                echo "::warning::$patch e' gia' nel submodule third-party/$lib: la patch non serve piu', toglierla"
                echo "- \`$patch\` e' gia' nel submodule \`third-party/$lib\`: toglierla." >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done

      # Anche la release (non firmata senza RELEASE_KEYSTORE_PATH): R8, lintVital e il codice solo di release si
      # compilano a ogni push, non per la prima volta in publish-apk.yml al rilascio.
      - run: ./gradlew assembleDebug :app:assembleRelease lint detekt testDebugUnitTest :core:poi:test :core:tiles:test :tools:data-pipeline:content:test --no-daemon

      # Tutti i test Python della pipeline e degli script dei workflow: un test nuovo (test_*.py) viene eseguito senza
      # toccare il workflow. Un file o una connessione lasciati aperti (ResourceWarning) fanno fallire il passo: Python li
      # segnala solo come avviso, anche con -W error. Lo stesso per un'eccezione in un thread: unittest non la vede e
      # scrive OK.
      - name: Test Python della pipeline
        shell: bash
        run: |
          set -e
          for t in tools/data-pipeline/scripts/test_*.py .github/scripts/test_*.py; do
            echo "== $t"
            python3 -W always::ResourceWarning "$t" 2>&1 | tee "$RUNNER_TEMP/python-test.log"
            if grep -q ResourceWarning "$RUNNER_TEMP/python-test.log"; then
              echo "::error::$t lascia file o connessioni aperti (ResourceWarning)"
              exit 1
            fi
            if grep -q "Exception in thread" "$RUNNER_TEMP/python-test.log"; then
              echo "::error::$t lascia un'eccezione non gestita in un thread"
              exit 1
            fi
          done

      # Vulnerabilita' note (OSV) nelle dipendenze risolte di app e pipeline: un errore fa fallire il job. Le
      # versioni piu' nuove sono solo note (::notice::); se OSV o i repository non rispondono e' un avviso.
      - name: Dipendenze senza vulnerabilita' note
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -q --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/app.txt"
          ./gradlew -q --no-daemon :tools:data-pipeline:content:dependencies --configuration runtimeClasspath > "$RUNNER_TEMP/pipeline.txt"
          python3 .github/scripts/check-dependencies.py "$RUNNER_TEMP/app.txt" "$RUNNER_TEMP/pipeline.txt"

      # Gli script di pubblicazione leggono la chiave pubblica da SyncConfig.kt: se il sorgente cambia forma, la
      # verifica di app-status.json fallisce, e nei job di pubblicazione questo si vede solo al rilascio. Qui
      # si verifica il file pubblicato a ogni push, con lo stesso script.
      - name: Firma di app-status.json verificabile con la chiave dell'app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          retry gh release download app-status --pattern 'app-status.json*' --clobber --dir "$RUNNER_TEMP/app-status" \
            --repo "$GITHUB_REPOSITORY"
          bash .github/scripts/verify-app-status.sh "$RUNNER_TEMP/app-status/app-status.json"

      # weekly-schedule.sh e' generato da regions.sh (generate-weekly-schedule.sh): se non e'
      # stato rigenerato dopo una modifica all'elenco, una regione nuova non verrebbe mai pubblicata
      # dallo schedule (o una tolta verrebbe ancora chiesta). Ogni regione una e una sola volta.
      - name: Calendario settimanale allineato a regions.sh
        shell: bash
        run: |
          set -euo pipefail
          source tools/data-pipeline/scripts/regions.sh
          source tools/data-pipeline/scripts/weekly-schedule.sh
          if ! diff <(for spec in "${ALL_REGIONS[@]}"; do echo "${spec%%|*}"; done | sort) \
            <(for d in 1 2 3 4 5 6 7; do v="WEEKLY_SCHEDULE_DAY_$d"; tr ',' '\n' <<< "${!v}"; done | sort); then
            echo "weekly-schedule.sh non corrisponde a regions.sh (< solo nell'elenco, > solo nel calendario o ripetute): rilanciare generate-weekly-schedule.sh" >&2
            exit 1
          fi

      # APK di debug per le prove: e' debuggabile (adb run-as, debugger), quindi chi ha accesso al dispositivo puo' leggere
      # dall'interno dell'app note e chiave API. Il nome lo dice, e l'artifact resta solo 7 giorni; per l'uso vero c'e'
      # l'APK di release firmato (publish-apk).
      - name: Carica l'APK di debug come artifact con nome eloquente
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          SHA="${GITHUB_SHA::7}"
          NAME="pocket-travel-debug-v${VERSION}-${SHA}-SOLO-PROVE-non-usare-con-dati-veri.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$NAME"
          echo "DEBUG_APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "DEBUG_APK_PATH=$RUNNER_TEMP/$NAME" >> "$GITHUB_ENV"

      # Nessun job usa questo APK: se il servizio degli artifact di GitHub non risponde (pagina HTML al posto del JSON
      # per tutti i 5 tentativi) build e test restano validi e il passo dopo lo segnala come avviso.
      - id: debug-apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          name: ${{ env.DEBUG_APK_NAME }}
          path: ${{ env.DEBUG_APK_PATH }}
          retention-days: 7

      - name: Segnala l'APK di debug non caricato
        if: steps.debug-apk.outcome == 'failure'
        shell: bash
        run: |
          msg="APK di debug non caricato come artifact (servizio degli artifact di GitHub): build e test sono passati, rilanciare il job per averlo"
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      # Salvata anche se il job fallisce (actions/cache salva solo a job riuscito): gli oggetti compilati prima
      # dell'errore servono al run dopo. Non si salva su corrispondenza esatta, la chiave e' immutabile.
      - name: Salva la cache di ccache per llama.cpp
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ccache
          key: ${{ steps.ccache.outputs.key }}

  # Controlla la sintassi dei workflow e, con shellcheck (preinstallato sul runner, actionlint lo trova da solo nel
  # PATH), gli script dei passi `run:`. Parte con ogni modifica a .github/ perche' il filtro `paths` sopra la include.
  # Rilascio ufficiale con versione e sha256 fissi (dal file checksums del rilascio): per aggiornare, cambiare
  # entrambi.
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installa actionlint
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint

      - name: Controlla i workflow
        run: |
          set -euo pipefail
          command -v shellcheck
          "$RUNNER_TEMP/actionlint/actionlint" -color .github/workflows/*.yml

  # Gli script della pipeline e dei workflow girano anche su un PC Windows con Git Bash (prove in locale, README della
  # pipeline): qui i loro test Python e una prova degli script in modalita' locale, cosi' una modifica che funziona
  # solo su Linux si vede subito. Il GITHUB_TOKEN legge soltanto, e in modalita' locale gh non scrive comunque.
  windows-scripts:
    name: Script su Windows
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # test_eval_common.py legge src/llama-chat.cpp dal submodule di llama.cpp. core.longpaths: tools/ui di
      # llama.cpp ha percorsi oltre i 260 caratteri di Windows, e senza il checkout fallisce.
      - name: Submodule di llama.cpp
        run: git -c core.longpaths=true submodule update --init --depth 1 third-party/llama-cpp

      - name: python3 e jq come su Linux
        run: |
          set -euo pipefail
          source tools/data-pipeline/scripts/portable.sh
          python3 --version
          [ "$(printf '{"a":"x"}' | jq -r .a)" = "x" ] || { echo "::error::jq scrive ancora le righe con CR LF" >&2; exit 1; }

      - name: Test Python della pipeline e degli script dei workflow
        run: |
          set -e
          for t in tools/data-pipeline/scripts/test_*.py .github/scripts/test_*.py; do
            echo "== $t"
            python -W always::ResourceWarning "$t" 2>&1 | tee "$RUNNER_TEMP/python-test.log"
            if grep -q ResourceWarning "$RUNNER_TEMP/python-test.log"; then
              echo "::error::$t lascia file o connessioni aperti (ResourceWarning)"
              exit 1
            fi
            if grep -q "Exception in thread" "$RUNNER_TEMP/python-test.log"; then
              echo "::error::$t lascia un'eccezione non gestita in un thread"
              exit 1
            fi
          done

      # Senza GITHUB_ACTIONS gli script si comportano come su un PC (env.sh): valori di prova e gh in sola lettura.
      - name: Script di publish-regions in modalita' locale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          env -u GITHUB_ACTIONS bash .github/scripts/install-go-pmtiles.sh
          env -u GITHUB_ACTIONS REGIONS_INPUT=andorra,italia GITHUB_OUTPUT="$RUNNER_TEMP/plan-output.txt" \
            bash .github/scripts/publish-regions/plan-shards.sh
          grep -q '^shard0=.' "$RUNNER_TEMP/plan-output.txt"

  # Prova con un modello vero: llama-server per la CPU dal llama.cpp con le patch di third-party/patches/llama-cpp, e
  # poche risposte fisse del modello piu' piccolo del catalogo dei modelli (llm-smoke.sh, llm_smoke.py). Formato del
  # prompt, rifiuto, assenza di <think> e grammatica della categoria altrimenti si provano solo sull'emulatore, a mano.
  # Non prova il codice JNI dell'app. Gira solo quando cambiano le patch, il commit del submodule, il catalogo dei modelli
  # (LlmModelCatalog.kt, da cui il job legge URL e sha256) o gli script e i file che la prova legge: negli altri casi il
  # job finisce dopo il checkout.
  llm-smoke:
    name: Modello vero con llama.cpp
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 300M
      # Il compilatore e' quello dell'immagine: con "content" una nuova immagine con lo stesso gcc non svuota la cache.
      CCACHE_COMPILERCHECK: content
      # Il modello piu' piccolo del catalogo dei modelli (LlmModelCatalog.kt), addestrato sulle guide in italiano come
      # le righe di llm_smoke.py.
      LLM_SMOKE_MODEL: pt-qwen3.5-0.8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Base: il commit di partenza della pull request o quello prima del push. Senza base (branch nuovo, push forzato su
      # un commit non piu' scaricabile) la prova gira. Gira anche quando cambia questo workflow, il catalogo dei modelli
      # (LlmModelCatalog.kt) o la sua lettura (resolve_ai_models.py), da cui dipende il job, e quando cambia un file che
      # la prova carica o importa (env.sh, portable.sh, word_lists.py con il suo .txt, city_wikipedia.py, regions.sh).
      - name: Patch di llama.cpp o script della prova cambiati
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          run=true
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] \
            && git fetch --no-tags --depth=1 origin "$BASE"; then
            git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
            grep -qE '^(third-party/patches/llama-cpp/|third-party/llama-cpp$|tools/data-pipeline/scripts/(eval_common|eval_retrieval|llm_smoke|resolve_ai_models|word_lists|city_wikipedia|city_population)\.py$|tools/data-pipeline/scripts/(portable|regions)\.sh$|feature/ai/src/main/kotlin/com/pockettravel/feature/ai/LlmModelCatalog\.kt$|feature/ai/src/main/resources/pockettravel/word_lists\.txt$|\.github/scripts/(llm-smoke|env)\.sh$|\.github/workflows/android-ci\.yml$)' \
              "$RUNNER_TEMP/changed.txt" || run=false
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

      - name: Submodule di llama.cpp, ccache e modello da usare
        if: steps.changes.outputs.run == 'true'
        id: model
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 third-party/llama-cpp
          echo "LLAMA_COMMIT=$(git rev-parse HEAD:third-party/llama-cpp)" >> "$GITHUB_ENV"
          # ccache accelera soltanto: se apt fallisce si compila da zero.
          sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq ccache \
            || echo "::warning::ccache non installato, llama.cpp si compila senza"
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import os, sys
          sys.path.insert(0, "tools/data-pipeline/scripts")
          from resolve_ai_models import catalog_models
          source = open("feature/ai/src/main/kotlin/com/pockettravel/feature/ai/LlmModelCatalog.kt", encoding="utf-8").read()
          m = next(m for m in catalog_models(source) if m["modelId"] == os.environ["LLM_SMOKE_MODEL"])
          print(f"url={m['url']}\nsha256={m['sha256']}\nfile={m['modelVersion']}")
          EOF

      # Prefisso diverso da ccache-llama- del job "build": il restore-keys di quel job non deve trovare gli oggetti di gcc.
      - name: Cache di ccache per llama.cpp su Linux
        if: steps.changes.outputs.run == 'true'
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ccache
          key: ccache-linux-llama-${{ env.LLAMA_COMMIT }}-${{ hashFiles('third-party/patches/llama-cpp/**', '.github/scripts/llm-smoke.sh') }}
          restore-keys: ccache-linux-llama-

      # Prefisso = sha256 del catalogo dei modelli: un modello ricaricato con un'altra impronta si riscarica. Si ripristina
      # la copia salvata piu' di recente con quel prefisso; una copia corrotta (chiave fissa, non sovrascrivibile) si
      # riscarica e si salva con una chiave nuova, che la sostituisce nei ripristini dopo.
      - name: Cache del modello
        if: steps.changes.outputs.run == 'true'
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/llm-smoke
          key: llm-smoke-model-${{ steps.model.outputs.sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: llm-smoke-model-${{ steps.model.outputs.sha256 }}

      # L'impronta si controlla sempre, anche con il file preso dalla cache: un file corrotto non finisce in cache e non
      # arriva alla prova.
      - name: Scarica e verifica il modello
        if: steps.changes.outputs.run == 'true'
        id: model-file
        env:
          URL: ${{ steps.model.outputs.url }}
          SHA256: ${{ steps.model.outputs.sha256 }}
          FILE: /home/runner/.cache/llm-smoke/${{ steps.model.outputs.file }}
          CACHED_KEY: ${{ steps.model-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          download() {
            mkdir -p "$(dirname "$FILE")"
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$FILE" "$URL"
          }
          if [ -z "$CACHED_KEY" ] || [ ! -s "$FILE" ]; then
            download
          elif echo "$SHA256  $FILE" | sha256sum -c --status -; then
            echo "-- modello dalla cache $CACHED_KEY, impronta ok"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::warning::modello della cache $CACHED_KEY con un'impronta diversa da quella del catalogo: si riscarica"
            download
          fi
          echo "$SHA256  $FILE" | sha256sum -c -
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      # Subito dopo il download, non a fine job: anche una prova che fallisce (una patch rotta) lascia il modello in cache.
      - name: Salva il modello in cache
        if: steps.changes.outputs.run == 'true' && steps.model-file.outputs.fresh == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/llm-smoke
          key: llm-smoke-model-${{ steps.model.outputs.sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build di llama.cpp e risposte del modello
        if: steps.changes.outputs.run == 'true'
        env:
          FILE: /home/runner/.cache/llm-smoke/${{ steps.model.outputs.file }}
        run: bash .github/scripts/llm-smoke.sh "$FILE"

  # Test su emulatore (Compose, percorsi di navigazione, migrazioni Room, installazione dei pacchetti), in parallelo al job
  # "build". Quelli che chiedono file sul dispositivo (modello GGUF, segmenti .rd5) qui si saltano da soli (assumeTrue).
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # Stesso JDK del job "build".
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # Cache di Gradle in sola lettura: la scrive solo il job "build" di android-ci.yml, che compila anche la
      # pipeline. Un salvataggio per job riempirebbe il limite di 10 GB delle cache del repository e farebbe
      # sfrattare le altre (dump, traduzioni, ccache).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Heap del daemon a 3 GB, come nel job "build" (vedi li').
      - name: Memoria di Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=$(sed -n 's/^org.gradle.jvmargs=//p' gradle.properties | sed 's/-Xmx[0-9]*[mMgG]/-Xmx3g/')" >> "$HOME/.gradle/gradle.properties"

      # ccache per llama.cpp, come nel job "build" (stessa chiave: gli oggetti sono gli stessi), in sola lettura: la
      # salva solo il job "build" (due job sulla stessa chiave: "Unable to reserve cache" a ogni run).
      - name: ccache per llama.cpp
        uses: ./.github/actions/setup-ccache-llama

      # Immagine di sistema dell'emulatore (~1,3 GB): senza cache sdkmanager la scarica a ogni run (~80 s). La chiave e'
      # fissa: va cambiata insieme ad api-level, target o arch qui sotto.
      - name: Cache dell'immagine di sistema dell'emulatore
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-system-image-34-google_apis-x86_64

      # Accelerazione hardware dell'emulatore x86_64 sui runner Linux.
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # android-emulator-runner installa la sua versione dei cmdline-tools con un mkdir che fallisce se la cartella c'e'
      # gia' (immagine ubuntu-24.04); adb nel PATH serve anche alla sua pulizia finale.
      - name: Prepara l'SDK per l'emulatore
        run: |
          sudo rm -rf "$ANDROID_HOME/cmdline-tools"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Tutte le 4 vCPU del runner (il predefinito dell'azione e' 2).
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      # Il log di Gradle dice solo che un modulo ha test falliti: quali e perche' sono nel report HTML e nei risultati
      # con il logcat di ogni test.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: device-tests-report
          path: |
            */build/reports/androidTests/connected/
            */*/build/reports/androidTests/connected/
            */build/outputs/androidTest-results/connected/
            */*/build/outputs/androidTest-results/connected/
          retention-days: 7
