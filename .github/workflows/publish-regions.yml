name: Publish regions

# Pubblica il catalogo (manifest.json e indici) su GitHub Pages e i pacchetti delle regioni sugli asset delle release.
# Job, calendario settimanale, bucket e shard, run sovrapposte e permessi: sezione "Workflow publish-regions.yml" di
# tools/data-pipeline/README.md. Gli script lunghi dei job sono in .github/scripts/publish-regions/.
on:
  # Alle 02:17 UTC: il minuto 0 e' il picco delle run programmate di GitHub, che le fa partire con ore di ritardo.
  schedule:
    - cron: '17 2 * * 1'  # lunedi - bucket giorno 1 (piu' visitate)
    - cron: '17 2 * * 2'  # martedi - bucket giorno 2
    - cron: '17 2 * * 3'  # mercoledi - bucket giorno 3
    - cron: '17 2 * * 4'  # giovedi - bucket giorno 4
    - cron: '17 2 * * 5'  # venerdi - bucket giorno 5
    - cron: '17 2 * * 6'  # sabato - bucket giorno 6
    - cron: '17 2 * * 0'  # domenica - bucket giorno 7 (meno visitate)
  workflow_dispatch:
    inputs:
      regions:
        description: >
          regionId da (ri)generare in questa run, separati da virgola (vedi
          tools/data-pipeline/scripts/regions.sh per l'elenco completo).
          Vuoto = tutte le regioni.
        required: false
        default: ""
      poi_max_age_days:
        description: >
          Eta' massima (giorni) di un poi.db pubblicato prima di rigenerarlo (POI_MAX_AGE_DAYS di
          build-region.sh). 0 = rigenera i POI delle regioni scelte anche se recenti. Vuoto = 6,
          cioe' POI rinnovati a ogni turno settimanale della regione.
        required: false
        default: ""
      address_cell_max_age_days:
        description: >
          Eta' massima (giorni) di una cella dei civici pubblicata prima di rigenerarla
          (ADDRESS_CELL_MAX_AGE_DAYS di build-address-cell.sh), solo per le celle della quota di
          oggi. -1 = rigenera anche le celle pubblicate oggi. Vuoto = 30.
        required: false
        default: ""
      address_cells:
        description: >
          Celle dei civici da rigenerare al posto della quota di oggi, id z/x/y separati da virgola
          (es. dopo un cambio della lista bianca Overture). Con questo input, se
          address_cell_max_age_days e' vuoto vale -1. Vuoto = quota di oggi.
        required: false
        default: ""
      time_budget_minutes:
        description: >
          Minuti dopo i quali uno shard non inizia altre regioni e le rimanda a una run successiva
          (job "build"). Vuoto = 270. Un valore piccolo serve a provare il rinvio.
        required: false
        default: ""
      force_cities:
        description: >
          Pubblica il pacchetto delle citta' anche se ha meno dati di quello pubblicato (FORCE_CITIES di
          build-cities.sh), per quando i dati sono calati davvero su Wikidata o Wikipedia.
        type: boolean
        default: false
      only:
        description: >
          Dati da costruire in questa run: all = tutti; addresses, transit, guides, world-map o regions = solo civici,
          mezzi pubblici, guide, mappa del mondo o regioni. Il catalogo tiene le voci pubblicate degli altri; i controlli
          Overture e vaccinazioni girano solo con all.
        type: choice
        options: [all, addresses, transit, guides, world-map, regions]
        default: all
      continuation:
        description: >
          Numero della continuazione automatica (la imposta il job "after-deploy" quando rilancia le
          regioni rimandate; al massimo 4). Da lasciare vuoto nelle run manuali.
        required: false
        default: ""

# Solo da "main": i job che scrivono sulle release o su Pages (plan, world-map, address-grid, publish, deploy,
# after-deploy) e quello che apre le issue (overture-check) si fermano su un altro ramo; guides, transit e build
# dipendono da plan e vengono saltati con lui. Il calendario gira sempre sul ramo predefinito.
# Minimo a livello di workflow; i permessi in piu' stanno sui singoli job (README della pipeline, "Permessi").
permissions:
  contents: read

# Nessuna concurrency a livello di workflow (README della pipeline, "Run sovrapposte"): solo i job "publish" e "deploy"
# stanno nel gruppo "pages".

# bash con -eo pipefail in ogni passo (lo stesso di "shell: bash" esplicito; senza, GitHub usa "bash -e").
defaults:
  run:
    shell: bash

env:
  # Unica per tutta la run, riusata dai job "build" e "publish".
  PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  # git legge la configurazione anche dall'ambiente: niente suggerimento "Using 'master' as the name for the initial
  # branch" in ogni checkout.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Elenco delle regioni della run (bucket del giorno, input manuale o tutte), diviso nei 3 shard del job "build".
  plan:
    name: Piano degli shard
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      shard0: ${{ steps.plan.outputs.shard0 }}
      shard1: ${{ steps.plan.outputs.shard1 }}
      shard2: ${{ steps.plan.outputs.shard2 }}
      shard0_extra: ${{ steps.plan.outputs.shard0_extra }}
      shard1_extra: ${{ steps.plan.outputs.shard1_extra }}
      shard2_extra: ${{ steps.plan.outputs.shard2_extra }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assicura le release che ospitano i pacchetti regionali
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-regions/ensure-releases.sh

      - name: Determina le regioni della run e gli shard
        id: plan
        # Input dall'ambiente, non interpolati nello script (niente iniezione di comandi).
        env:
          REGIONS_INPUT: ${{ github.event.inputs.regions }}
          POI_MAX_AGE_INPUT: ${{ github.event.inputs.poi_max_age_days }}
          SCHEDULE: ${{ github.event.schedule }}
        run: bash .github/scripts/publish-regions/plan-shards.sh

  # Pacchetto guide unico (guides.db e guides-en.db) e il suo frammento di catalogo: poche centinaia di pagine
  # Wikivoyage, un solo job. Come "world-map" e "address-grid", non gira nelle continuazioni (input continuation > 0):
  # le ha gia' fatte la run che ha rimandato le regioni, e il job "publish" tiene le voci pubblicate.
  guides:
    name: Guide
    needs: plan
    if: ${{ !(github.event.inputs.continuation > 0) && contains(fromJSON('["all","guides"]'), github.event.inputs.only || 'all') }}
    runs-on: ubuntu-24.04
    # 240: scaricare le pagine e generare le guide richiede pochi minuti, il resto e' il tetto di traduzione (75 minuti in
    # tutto, vedi GUIDES_TRANSLATE_SECONDS sotto) con la conversione dei modelli alla prima run.
    timeout-minutes: 240
    # actions: write per togliere le cache delle frasi tradotte piu' vecchie (passo dopo il salvataggio).
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pipeline

      # Traduzione delle sezioni povere dall'altra lingua (translate_guides.py): motore, modelli e cache delle frasi
      # gia' tradotte (setup-translation). Mai bloccante: senza, le guide escono come prima. Accesa solo con la variabile
      # del repository TRANSLATE_GUIDES = true, dopo una revisione a campione delle traduzioni (sostituiscono gran parte
      # delle sezioni italiane).
      - name: Prepara la traduzione
        if: ${{ vars.TRANSLATE_GUIDES == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/setup-translation
        with:
          cache-name: guides

      # La passata inglese gira per prima: la guida che pubblica (GUIDES_FINAL_COPY) serve all'italiana per tradurre le
      # sezioni del governo canadese (GUIDES_SOURCE_DB), e la passata inglese ricava da sola quella italiana per le sue.
      # GUIDES_TRANSLATE_SECONDS: tempo massimo di traduzione di ciascuna passata (60 minuti per l'italiano, che parte
      # da molto piu' testo inglese da tradurre, 15 per l'inglese), cosi' una direzione non toglie tempo all'altra; il
      # job pubblica comunque quello che e' pronto, il resto segue nelle run dopo grazie alla cache.
      # GUIDES_PAGE_CACHE: la passata italiana riusa le pagine Wikivoyage scaricate da quella inglese.
      # Il token serve solo a "gh release upload" di questo passo (build-guides.sh non usa gh).
      - name: Genera guides.db e guides-en.db
        env:
          GH_TOKEN: ${{ github.token }}
          GUIDES_PAGE_CACHE: ${{ runner.temp }}/guides-pages
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          # Data + numero e tentativo della run: unica per run, come nel job "build".
          VERSION="$(date -u +%Y.%m.%d).$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/region-data-guide"
          mkdir -p "$RUNNER_TEMP/fragments"
          # Guida inglese (voce "guidesEn", asset guides-en--...): stessa release, cartella a parte. Se
          # fallisce non blocca quella italiana: `manifest.json` tiene la voce guidesEn gia' pubblicata.
          OUT_EN="$RUNNER_TEMP/guides-en-out"
          EN_FINAL="$RUNNER_TEMP/guides-en-final.db"
          if GUIDES_TRANSLATE_SECONDS=900 GUIDES_FINAL_COPY="$EN_FINAL" tools/data-pipeline/scripts/build-guides.sh "$VERSION" \
            "$RELEASE_URL" "$OUT_EN" "$PAGES_BASE_URL/manifest.json" en; then
            if [ -f "$OUT_EN/guides.db.xz" ]; then
              asset="$OUT_EN/guides-en--${VERSION}--guides.db.xz"
              cp "$OUT_EN/guides.db.xz" "$asset"
              retry gh release upload region-data-guide "$asset" --repo "$GITHUB_REPOSITORY" --clobber
            fi
            cp "$OUT_EN/manifest-fragment.json" "$RUNNER_TEMP/fragments/guides-en.json"
          else
            echo "::warning::guida inglese non generata in questa run, resta quella pubblicata"
          fi
          OUT="$RUNNER_TEMP/guides-out"
          GUIDES_TRANSLATE_SECONDS=3600 GUIDES_SOURCE_DB="$EN_FINAL" tools/data-pipeline/scripts/build-guides.sh "$VERSION" \
            "$RELEASE_URL" "$OUT" "$PAGES_BASE_URL/manifest.json"
          if [ -f "$OUT/guides.db.xz" ]; then
            asset="$OUT/guides--${VERSION}--guides.db.xz"
            cp "$OUT/guides.db.xz" "$asset"
            retry gh release upload region-data-guide "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          cp "$OUT/manifest-fragment.json" "$RUNNER_TEMP/fragments/guides.json"

      # Nuova cache delle frasi solo se questa run ne ha tradotte di nuove (translate-grown.flag).
      - name: Salva le frasi tradotte
        id: save-translations
        if: ${{ always() && hashFiles('translate-grown.flag') != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/translate-cache
          key: translations-guides-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Elimina le cache delle frasi piu' vecchie
        if: ${{ always() && steps.save-translations.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/trim-caches.sh translations-guides- "translations-guides-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      # !cancelled(): anche se la guida italiana fallisce, il frammento della guida inglese (guides-en.json) va al job "publish".
      - name: Carica il frammento di catalogo delle guide
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-fragments-guides
          path: |
            ${{ runner.temp }}/fragments/guides.json
            ${{ runner.temp }}/fragments/guides-en.json
          retention-days: 1

  # Mappa del mondo online a bassa risoluzione (z0-8, ~555 MB, release "world-map"), letta dall'app a pezzi con
  # richieste Range quando la mappa di una regione non e' scaricata. Rigenerata solo se quella pubblicata ha piu' di
  # WORLD_MAP_MAX_AGE_DAYS giorni o manca: altrimenti nessun frammento, e mergeManifests riporta la voce pubblicata.
  world-map:
    name: Mappa del mondo
    if: ${{ github.ref == 'refs/heads/main' && !(github.event.inputs.continuation > 0) && contains(fromJSON('["all","world-map"]'), github.event.inputs.only || 'all') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      WORLD_MAP_MAX_AGE_DAYS: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go-pmtiles lo installa world-map.sh, solo quando rigenera la mappa.
      - uses: ./.github/actions/setup-pipeline
        with:
          gradle: false

      - name: Rigenera la mappa del mondo se serve
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-regions/world-map.sh

      - name: Carica il frammento di catalogo della mappa del mondo
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-fragments-world-map
          path: ${{ runner.temp }}/fragments/world-map.json
          retention-days: 1

  # Celle della griglia adattiva dei civici (OSM + Overture), README della pipeline "Numeri civici a celle": una quota
  # giornaliera (hash stabile dell'id mod 30), cosi' ogni cella si ricostruisce al piu' ogni 30 giorni. Le celle vivono
  # sulle release "address-cells-<n>" (n = hash dell'id mod ADDRESS_CELL_RELEASES, per il limite di 1000 asset per
  # release). Da 6 release a 12: 12 e' multiplo di 6, quindi una cella con (hash mod 12) < 6 resta dov'e' e le altre
  # passano alla release n+6 solo quando si rigenerano. Con ADDRESS_CELL_MIN_ZOOM 7 la partizione ha circa 2000 celle
  # (2066 a novembre 2026), quindi circa 70 al giorno; il numero esatto e' nella riga "celle nella partizione attuale" del log.
  # Indice (address-grid.json) e frammento di catalogo vanno al job "publish" come artifact. Non gira nelle continuazioni.
  address-grid:
    name: Civici
    if: ${{ github.ref == 'refs/heads/main' && !(github.event.inputs.continuation > 0) && contains(fromJSON('["all","addresses"]'), github.event.inputs.only || 'all') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      PYTHON_BIN: python3
      ADDRESS_CELL_RELEASES: 12
      # Nessuna cella piu' grande di una z7: una regione piccola non scarica una cella che copre mezzo continente.
      ADDRESS_CELL_MIN_ZOOM: 7
      ADDRESS_CELL_MAX_AGE_DAYS: ${{ github.event.inputs.address_cell_max_age_days || (github.event.inputs.address_cells && '-1') || '30' }}
      # Dall'env, non interpolato nello script (niente iniezione di comandi).
      ADDRESS_CELLS_INPUT: ${{ github.event.inputs.address_cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # duckdb (con httpfs/spatial, caricate a runtime da overture_addresses.py).
      - uses: ./.github/actions/setup-pipeline
        with:
          pmtiles: true
          duckdb: true

      # Seme della partizione rigenerato a ogni rilascio Overture (README della pipeline): nelle run con il seme in cache
      # costa solo la richiesta dell'elenco dei rilasci. Mai bloccante: senza seme rigenerato vale quello del repository.
      - name: Rilascio Overture del seme
        id: seed-release
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "release=$(python3 tools/data-pipeline/scripts/overture_addresses.py --print-release)" >> "$GITHUB_OUTPUT"

      - name: Seme gia' rigenerato?
        id: seed-cache
        if: steps.seed-release.outputs.release != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/address-seed
          key: address-seed-${{ steps.seed-release.outputs.release }}

      - name: Rigenera il seme
        id: seed-build
        if: steps.seed-release.outputs.release != '' && steps.seed-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          OVERTURE_RELEASE: ${{ steps.seed-release.outputs.release }}
          ADDRESS_SEED_DIR: ${{ runner.temp }}/address-seed
        run: bash .github/scripts/publish-regions/address-seed.sh

      - name: Salva il seme rigenerato
        if: steps.seed-build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/address-seed
          key: address-seed-${{ steps.seed-release.outputs.release }}

      - name: Scegli il seme
        env:
          SEED_BUILD: ${{ steps.seed-build.outcome }}
        run: |
          SEED="$RUNNER_TEMP/address-seed/address-grid-seed.tsv"
          if [ -s "$SEED" ]; then
            echo "ADDRESS_GRID_SEED=$SEED" >> "$GITHUB_ENV"
            # Le celle senza copertura si segnalano solo nella run che rigenera il seme, una volta per rilascio.
            [ "$SEED_BUILD" != success ] || echo "ADDRESS_GRID_SEED_FRESH=true" >> "$GITHUB_ENV"
            echo "-- seme rigenerato: $(wc -l < "$SEED") celle"
          else
            echo "::warning::seme dei civici non rigenerato (Overture o DuckDB non disponibili): vale quello del repository"
          fi

      # Un solo elenco delle release esistenti (come ensure-releases.sh): ensure_release solo per le mancanti. Elenco non
      # leggibile: restano tutte da controllare una per una.
      - name: Assicura le release delle celle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          EXISTING_TAGS="$(retry gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName')" || EXISTING_TAGS=""
          for n in $(seq 0 $((ADDRESS_CELL_RELEASES - 1))); do
            if grep -qxF "address-cells-$n" <<< "$EXISTING_TAGS"; then continue; fi
            ensure_release "address-cells-$n" \
              "Civici a celle ($n/$ADDRESS_CELL_RELEASES)" \
              "Asset binari (celle addresses.pmtiles.xz e indici addresses-search.db.xz della griglia adattiva dei civici) per l'app Pocket Travel, referenziati da address-grid.json su GitHub Pages. Non e' una release software."
          done

      - name: Costruisci la quota di celle di oggi
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-regions/address-grid.sh

      # Due artifact distinti: il job "publish" scarica "manifest-fragments-*" con merge-multiple (tutti i frammenti
      # nella stessa cartella), e l'indice, che non e' un frammento di catalogo, finirebbe scambiato per uno.
      - name: Carica il frammento di catalogo dell'indice dei civici
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-fragments-address-grid
          path: ${{ runner.temp }}/fragments/address-grid.json
          retention-days: 1

      - name: Carica l'indice dei civici
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: address-grid-index
          path: ${{ runner.temp }}/address-grid-index/address-grid.json
          retention-days: 1

  # Reti dei mezzi pubblici (GTFS) di tools/data-pipeline/transit-feeds.tsv, ricostruite solo se il feed e' cambiato o
  # la voce pubblicata ha piu' di 7 giorni; quelle con gli orari scaduti vanno tra le "Non incluse". Indice
  # (transit.json) e frammento di catalogo al job "publish" come artifact, come i civici. Non gira nelle continuazioni.
  transit:
    name: Mezzi pubblici
    needs: plan
    if: ${{ !(github.event.inputs.continuation > 0) && contains(fromJSON('["all","transit"]'), github.event.inputs.only || 'all') }}
    runs-on: ubuntu-24.04
    # Circa 120 reti: download in parallelo per host, conversione una rete alla volta (transit.sh); il download piu'
    # lungo e' la Toscana, da 6,5 a 22 minuti nelle run misurate.
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      # Inizio del job (epoca): l'ora limite dei download si conta da qui, preparazione compresa.
      - name: Segna l'inizio del job
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pipeline

      - name: Costruisci le reti dei mezzi pubblici
        run: bash .github/scripts/publish-regions/transit.sh
        env:
          GH_TOKEN: ${{ github.token }}
          # Come timeout-minutes del job: transit.sh ne ricava l'ora oltre la quale nessun download continua.
          TRANSIT_JOB_MINUTES: 150

      - name: Carica il frammento di catalogo delle reti dei mezzi pubblici
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-fragments-transit
          path: ${{ runner.temp }}/fragments/transit.json
          retention-days: 1

      - name: Carica l'indice delle reti dei mezzi pubblici
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transit-index
          path: ${{ runner.temp }}/transit-index/transit.json
          retention-days: 1

  # Controllo della lista bianca Overture, una volta per rilascio: le coppie (paese, dataset,
  # licenza) nuove o sparite finirebbero scartate in silenzio dalle celle dei civici. Esito in una
  # issue (etichetta overture-licenze), che arriva per email; il rilascio controllato resta come
  # chiave della cache di Actions. Job a parte che nessuno aspetta (la query legge tutto il tema,
  # decine di minuti) e mai bloccante: se fallisce si ripete alla run successiva.
  overture-check:
    name: Controllo Overture
    if: ${{ github.ref == 'refs/heads/main' && !(github.event.inputs.continuation > 0) && (github.event.inputs.only || 'all') == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pipeline
        with:
          gradle: false
          duckdb: true

      - name: Rilascio Overture da controllare
        id: overture-release
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "release=$(python3 tools/data-pipeline/scripts/overture_addresses.py --print-release)" >> "$GITHUB_OUTPUT"

      - name: Rilascio gia' controllato?
        id: overture-checked
        if: steps.overture-release.outputs.release != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/overture-checked
          key: overture-check-${{ steps.overture-release.outputs.release }}
          lookup-only: true

      - name: Controlla le fonti Overture della lista bianca
        id: overture-check
        if: steps.overture-release.outputs.release != '' && steps.overture-checked.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OVERTURE_RELEASE: ${{ steps.overture-release.outputs.release }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/overture-check.md"
          python3 tools/data-pipeline/scripts/overture_addresses.py \
            --check-whitelist tools/data-pipeline/overture-address-sources.tsv "$REPORT" --release "$OVERTURE_RELEASE"
          if [ -s "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            TITLE="Overture $OVERTURE_RELEASE: fonti dei civici da rivedere"
            echo "::warning::$TITLE (lista bianca tools/data-pipeline/overture-address-sources.tsv, dettagli nel riepilogo)"
            gh label create overture-licenze --repo "$GITHUB_REPOSITORY" --color d93f0b \
              --description "Fonti Overture dei civici da rivedere" --force
            EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --label overture-licenze --state all \
              --search "\"$OVERTURE_RELEASE\" in:title" --json number --jq 'length')"
            if [ "$EXISTING" -eq 0 ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label overture-licenze --body-file "$REPORT"
            fi
          else
            echo "-- rilascio $OVERTURE_RELEASE: nessuna fonte nuova o sparita"
          fi
          mkdir -p "$RUNNER_TEMP/overture-checked"
          echo "$OVERTURE_RELEASE" > "$RUNNER_TEMP/overture-checked/release"

      - name: Segna il rilascio come controllato
        if: steps.overture-check.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/overture-checked
          key: overture-check-${{ steps.overture-release.outputs.release }}

  # Controllo deriva dei dati vaccinali (TSV curati a mano in content/src/main/resources/vaccinations/),
  # una volta a settimana col bucket del lunedi' e nelle run manuali: confronta Travel.gc.ca, il PDF
  # Hajj saudita e l'ultimo statement del comitato polio OMS con l'istantanea vaccinations-drift.tsv.
  # Se qualcosa e' cambiato lascia un warning e il resoconto nel riepilogo della run; non tocca i TSV
  # e non blocca la pubblicazione (nessuno lo aspetta, gli errori di rete diventano un warning).
  vaccinations-check:
    name: Controllo vaccinazioni
    if: ${{ github.event.schedule == '17 2 * * 1' || (github.event_name == 'workflow_dispatch' && !(github.event.inputs.continuation > 0) && (github.event.inputs.only || 'all') == 'all') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Controlla le fonti dei dati vaccinali
        run: |
          set -uo pipefail
          REPORT="$RUNNER_TEMP/vaccinations-drift.md"
          # Il codice d'uscita in rc: con -e (la shell dei passi) un 2 fermerebbe il passo prima del case.
          rc=0
          python3 tools/data-pipeline/scripts/vaccinations_drift.py --report "$REPORT" || rc=$?
          case $rc in
            0) ;;
            2)
              cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::dati vaccinali da ricontrollare: le fonti sono cambiate dall'ultima curatela (dettagli nel riepilogo della run)"
              ;;
            *) echo "::warning::controllo deriva dei dati vaccinali non riuscito (fonte non raggiungibile?), si ripete la settimana prossima" ;;
          esac

  # Pacchetti delle regioni dello shard (poi.db, .rd5, citta', mappa d'insieme) sulle release "region-data*"; i
  # frammenti di catalogo vanno come artifact al job "publish" (job diversi non condividono il filesystem).
  build:
    name: Regioni (shard ${{ matrix.shard }})
    needs: plan
    # Solo gli shard con regioni (output "shards" del job "plan"): uno shard vuoto non parte.
    if: ${{ contains(fromJSON('["all","regions"]'), github.event.inputs.only || 'all') && needs.plan.outputs.shards != '[]' }}
    runs-on: ubuntu-24.04
    # Sotto le 6 h di GitHub (che interrompono il passo senza caricare i frammenti, run del
    # 2026-09-28). Il budget TIME_BUDGET_MINUTES (270) si conta dall'inizio del job, preparazione compresa; l'ultima
    # regione avviata puo' usare HEAVY_REGION_TIMEOUT_MINUTES (70, regioni pesanti) o REGION_TIMEOUT_MINUTES (45) per
    # build-region.sh e altrettanti (45) per ciascuna delle due build-cities.sh (italiano e inglese). Conto:
    # 270 + 70 = 340 minuti dall'inizio del job, + circa 10 per le build-cities.sh (in pratica pochi minuti l'una) e 5 per
    # i passi dopo (upload dei frammenti) = 355, sotto i 360 di GitHub. Il caso peggiore teorico (tre tetti pieni dopo
    # il budget) supera comunque il timeout.
    timeout-minutes: 355
    # actions: write per togliere le cache delle frasi tradotte e delle citta' piu' vecchie (passi dopo il salvataggio).
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards || '[]') }}
    env:
      SHARD: ${{ matrix.shard }}
      # Ogni regione torna in rotazione ogni 7 giorni e si rigenera oltre POI_MAX_AGE_DAYS giorni:
      # 6 rinnova i POI a ogni turno (7 li rinnoverebbe ogni due settimane).
      POI_MAX_AGE_DAYS: ${{ github.event.inputs.poi_max_age_days || '6' }}
      FORCE_CITIES: ${{ github.event.inputs.force_cities == 'true' && '1' || '' }}
      # Passato il budget lo shard non inizia altre regioni: le rimanda (deferred-<shard>.txt) e il
      # job "after-deploy" le rilancia in una run nuova. Un build-region.sh oltre il suo tetto e' fallito: 45 minuti
      # (REGION_TIMEOUT_MINUTES, lo stesso tetto, a parte, per ognuna delle due build-cities.sh) o, per le regioni di
      # HEAVY_REGIONS che lo superano spesso, HEAVY_REGION_TIMEOUT_MINUTES. Il budget lascia posto a quest'ultimo
      # tetto nel timeout-minutes del job.
      TIME_BUDGET_MINUTES: ${{ github.event.inputs.time_budget_minutes || '270' }}
      REGION_TIMEOUT_MINUTES: 45
      HEAVY_REGIONS: germania canada-nunavut regno-unito russia-siberia
      HEAVY_REGION_TIMEOUT_MINUTES: 70
      # Traduzione delle sezioni povere delle citta' dall'altra lingua (translate_guides.py cities), tolta al budget di sopra:
      # al massimo 120 secondi per ogni cities.db (italiano e inglese ciascuno) e 40 minuti in tutto per lo shard
      # (TRANSLATE_DEADLINE, fissato all'inizio di build-shard.sh); passati questi tempi le citta' restano com'erano e il
      # resto segue alla prossima rotazione della regione, la cache tiene il lavoro fatto.
      TRANSLATE_MAX_SECONDS: 120
      TRANSLATE_TOTAL_MINUTES: 40
    steps:
      # Inizio del job (epoca): il budget di tempo dello shard si conta da qui, non dall'inizio del passo che
      # genera le regioni, dopo checkout, Gradle, traduzione e cache.
      - name: Segna l'inizio del job
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go-pmtiles estrae la mappa d'insieme della regione (preview.pmtiles); osmium estrae i POI dagli estratti
      # Geofabrik (senza, build-region.sh interroga Overpass).
      - uses: ./.github/actions/setup-pipeline
        with:
          pmtiles: true
          osmium: true

      # Dump di Wikivoyage (MediaWiki Content File Exports, IT ~57 MB, EN ~190 MB, uno al mese il 1°) nella cache di
      # Actions, con la chiave dagli SHA256SUMS del dump corrente: gli shard e le run del mese non li riscaricano
      # (fetch_wikivoyage_dump_parts e wikivoyage_dumps_key in lib.sh, WIKIVOYAGE_DUMP_CACHE). Mai bloccante.
      - name: Chiave dei dump di Wikivoyage
        id: dumps
        continue-on-error: true
        run: |
          set -euo pipefail
          source tools/data-pipeline/scripts/lib.sh
          key="$(wikivoyage_dumps_key)" || echo "::warning::dump di Wikivoyage: chiave della cache non calcolata, cache saltata"
          echo "key=${key:-}" >> "$GITHUB_OUTPUT"

      - name: Cache dei dump di Wikivoyage
        if: steps.dumps.outputs.key != ''
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wikivoyage-dumps
          key: ${{ steps.dumps.outputs.key }}

      # Motore, modelli e cache delle frasi gia' tradotte di questo shard (setup-translation). Mai bloccante. La cache e'
      # per shard: una regione che cambia shard ritraduce le sue citta' (le frasi sono per hash del testo, nessun danno).
      - name: Prepara la traduzione delle citta'
        if: ${{ vars.TRANSLATE_GUIDES == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/setup-translation
        with:
          cache-name: cities-${{ matrix.shard }}

      # Dati gia' chiesti a Wikidata: popolazione e coordinate delle citta' (city_population.py, CITY_FACTS_CACHE) e fama e
      # patrimonio dei POI (poi_wikidata.py, POI_WIKIDATA_CACHE), due file nella stessa cartella. Si riparte dalla cache
      # piu' recente dello stesso shard e, se manca, da quella di qualunque shard (ripartire sempre dall'ultimo che ha
      # salvato perderebbe le aggiunte degli altri due); si chiedono solo le voci nuove o scadute, cosi' i tre shard
      # insieme mandano poche richieste a Wikimedia, che alle raffiche risponde 429.
      - name: Ripristina i dati Wikidata delle citta' e dei POI
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/city-facts
          key: city-facts-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            city-facts-${{ matrix.shard }}-
            city-facts-

      # Cartella degli estratti Geofabrik (GEOFABRIK_CACHE) in due cache, perche' invecchiano in modo diverso. Gli estratti
      # ridotti ai POI e l'indice (geofabrik_pois.py) valgono un giorno: Geofabrik li aggiorna ogni giorno e i POI si
      # rinnovano ogni 6; la chiave ha la data UTC, quindi continuazioni e nuovi tentativi dello stesso giorno li
      # riusano, il giorno dopo si riparte (anche dalle cache degli altri shard: con la continuazione le regioni
      # cambiano shard). I confini di Nominatim e i poligoni degli estratti cambiano di rado: chiave settimanale,
      # per shard. Mai bloccanti.
      - name: Chiavi delle cache di Geofabrik
        id: geofabrik-keys
        run: |
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Ripristina gli estratti di Geofabrik
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/geofabrik/*-poi.osm.pbf
            ${{ runner.temp }}/geofabrik/index-v1.json
          key: geofabrik-poi-${{ steps.geofabrik-keys.outputs.day }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            geofabrik-poi-${{ steps.geofabrik-keys.outputs.day }}-${{ matrix.shard }}-
            geofabrik-poi-${{ steps.geofabrik-keys.outputs.day }}-

      - name: Ripristina i confini e i poligoni di Geofabrik
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/geofabrik/confine-*.json
            ${{ runner.temp }}/geofabrik/*.poly
            ${{ runner.temp }}/geofabrik/*.geojson
          key: geofabrik-borders-${{ matrix.shard }}-${{ steps.geofabrik-keys.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: geofabrik-borders-${{ matrix.shard }}-${{ steps.geofabrik-keys.outputs.week }}-

      # Elenco dei file ripristinati: le cache si salvano solo se la run ne ha aggiunti.
      - name: Segna i file di Geofabrik ripristinati
        run: |
          mkdir -p "$RUNNER_TEMP/geofabrik"
          find "$RUNNER_TEMP/geofabrik" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/geofabrik-before.txt"

      # Il token serve solo a "gh release upload" di build-shard.sh.
      - name: Genera i pacchetti regionali dello shard
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED: ${{ needs.plan.outputs[format('shard{0}', matrix.shard)] }}
          EXTRA: ${{ needs.plan.outputs[format('shard{0}_extra', matrix.shard)] }}
          WIKIVOYAGE_DUMP_CACHE: ${{ runner.temp }}/wikivoyage-dumps
          CITY_FACTS_CACHE: ${{ github.workspace }}/city-facts/city-facts.json
          POI_WIKIDATA_CACHE: ${{ github.workspace }}/city-facts/poi-wikidata.json
          # Intervalli dei .rd5 gia' scaricati, riusati dalle regioni dopo nello stesso shard (34% dei
          # download .rd5 della run del 2026-09-28 erano tile gia' scaricate nello shard).
          RD5_RANGE_CACHE: ${{ runner.temp }}/rd5-range-cache
          # Estratti Geofabrik ridotti ai POI, riusati dalle regioni vicine dello stesso shard.
          GEOFABRIK_CACHE: ${{ runner.temp }}/geofabrik
        run: bash .github/scripts/publish-regions/build-shard.sh

      # Prima del salvataggio: via i file che non vanno in cache (pbf interi, file .part di download interrotti dal
      # timeout), poi si salva solo cio' che la run ha aggiunto. Il limite del repository e' 10 GB, condivisi con
      # Gradle, immagine dell'emulatore, dump di Wikivoyage e frasi tradotte (circa 5 GB a novembre 2026): oltre 1,5 GB di
      # estratti ridotti per shard non si salva.
      - name: Prepara le cache di Geofabrik
        id: geofabrik-prep
        if: ${{ always() }}
        continue-on-error: true
        env:
          GEOFABRIK_DIR: ${{ runner.temp }}/geofabrik
          MAX_POI_BYTES: 1610612736
        run: |
          [ -d "$GEOFABRIK_DIR" ] || exit 0
          find "$GEOFABRIK_DIR" -maxdepth 1 -type f \( -name '*.part' -o -name '*.part.osm.pbf' -o -name '*.tmp' \) -delete
          find "$GEOFABRIK_DIR" -maxdepth 1 -type f -name '*.osm.pbf' ! -name '*-poi.osm.pbf' -delete
          du -sh "$GEOFABRIK_DIR"
          pois='-poi\.osm\.pbf$|^index-v1\.json$'
          borders='^confine-.*\.json$|\.poly$|\.geojson$'
          grew() {
            now="$(find "$GEOFABRIK_DIR" -maxdepth 1 -type f -printf '%f\n' | sort | grep -E -e "$1" || true)"
            [ -n "$now" ] && [ "$now" != "$(grep -E -e "$1" "$RUNNER_TEMP/geofabrik-before.txt" || true)" ]
          }
          if grew "$pois"; then
            bytes="$(find "$GEOFABRIK_DIR" -maxdepth 1 -name '*-poi.osm.pbf' -printf '%s\n' | awk '{ s += $1 } END { print s + 0 }')"
            if [ "$bytes" -gt "$MAX_POI_BYTES" ]; then
              echo "::notice::estratti di Geofabrik: $((bytes / 1048576)) MB oltre la soglia di $((MAX_POI_BYTES / 1048576)) MB, cache non salvata"
            else
              echo "save_poi=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if grew "$borders"; then echo "save_borders=true" >> "$GITHUB_OUTPUT"; fi

      # Via le cache dei giorni scorsi (nessuna run le ripristina piu'), a prescindere dall'esito del salvataggio; le
      # copie di oggi restano, perche' una continuazione puo' assegnare le regioni di uno shard a un altro.
      - name: Elimina le cache degli estratti di Geofabrik dei giorni scorsi
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.geofabrik-keys.outputs.day }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key geofabrik-poi- --limit 100 --json key --jq '.[].key' \
            | awk -v today="geofabrik-poi-$DAY-" 'index($0, today) != 1' \
            | while read -r key; do gh cache delete "$key" --repo "$GITHUB_REPOSITORY" || echo "::warning::cache $key non tolta"; done

      - name: Salva gli estratti di Geofabrik
        id: save-geofabrik-poi
        if: ${{ always() && steps.geofabrik-prep.outputs.save_poi == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/geofabrik/*-poi.osm.pbf
            ${{ runner.temp }}/geofabrik/index-v1.json
          key: geofabrik-poi-${{ steps.geofabrik-keys.outputs.day }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Via le copie piu' vecchie di oggi dello shard, dopo il salvataggio.
      - name: Elimina le cache degli estratti di Geofabrik superate
        if: ${{ always() && steps.save-geofabrik-poi.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.geofabrik-keys.outputs.day }}
        run: bash .github/scripts/trim-caches.sh "geofabrik-poi-$DAY-$SHARD-" "geofabrik-poi-$DAY-$SHARD-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Salva i confini e i poligoni di Geofabrik
        id: save-geofabrik-borders
        if: ${{ always() && steps.geofabrik-prep.outputs.save_borders == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/geofabrik/confine-*.json
            ${{ runner.temp }}/geofabrik/*.poly
            ${{ runner.temp }}/geofabrik/*.geojson
          key: geofabrik-borders-${{ matrix.shard }}-${{ steps.geofabrik-keys.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Elimina le cache dei confini di Geofabrik superate
        if: ${{ always() && steps.save-geofabrik-borders.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.geofabrik-keys.outputs.week }}
        run: bash .github/scripts/trim-caches.sh "geofabrik-borders-$SHARD-" "geofabrik-borders-$SHARD-$WEEK-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      # Nuova cache delle frasi di questo shard solo se il passo sopra ne ha tradotte di nuove (translate-grown.flag).
      - name: Salva le frasi tradotte delle citta'
        id: save-translations
        if: ${{ always() && hashFiles('translate-grown.flag') != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/translate-cache
          key: translations-cities-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Elimina le cache delle frasi piu' vecchie
        if: ${{ always() && steps.save-translations.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/trim-caches.sh "translations-cities-$SHARD-" "translations-cities-$SHARD-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      # Ogni shard salva la sua copia, con le citta' e i POI nuovi di questa run; poi si tolgono le copie piu' vecchie dello
      # stesso shard. Il ripristino sopra prende la piu' recente di tutti gli shard.
      - name: Salva i dati Wikidata delle citta' e dei POI
        id: save-city-facts
        if: ${{ always() && hashFiles('city-facts/*.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/city-facts
          key: city-facts-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Elimina le cache Wikidata piu' vecchie
        if: ${{ always() && steps.save-city-facts.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/trim-caches.sh "city-facts-$SHARD-" "city-facts-$SHARD-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      # !cancelled(): anche quando il passo sopra esce con errore (nessuna regione completata) ma ha
      # regioni rimandate da passare alla continuazione.
      - name: Carica i frammenti di catalogo dello shard
        if: ${{ !cancelled() && steps.build.outputs.has_fragments == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-fragments-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/fragments/*.json
            ${{ runner.temp }}/fragments/*.tsv
            ${{ runner.temp }}/fragments/*.txt
          retention-days: 1

  # Unisce i frammenti di catalogo di shard, guide, mappa del mondo, civici e mezzi pubblici al `manifest.json` gia'
  # pubblicato e prepara il sito di Pages, che carica come artifact: firma e deploy sono nel job "deploy". Gira anche se
  # uno shard e' fallito del tutto (!cancelled()), cosi' il lavoro degli shard riusciti non va perso. Senza nessun
  # frammento il passo "Assembla il sito" fallisce nelle run che costruiscono regioni (only all o regions); con only
  # guides, world-map, addresses o transit (guide e mappa non cambiate) finisce in verde con un avviso e output
  # nothing=true, e "deploy", "after-deploy" e "cleanup" non girano. Senza il frammento di un job (guide, mappa del
  # mondo) resta la voce gia' pubblicata; se manca la voce delle guide la validazione ferma il deploy (la mappa del
  # mondo e' facoltativa).
  # Qui girano Gradle e gli script della pipeline, che elaborano dati di terzi: il job non ha MANIFEST_SIGNING_KEY ne'
  # permessi di scrittura, e Gradle gira senza daemon (--no-daemon, piu' "--stop" a fine job).
  publish:
    name: Pubblicazione
    needs: [guides, world-map, address-grid, transit, build]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    # Un merge sul catalogo e un deploy su Pages alla volta (README della pipeline, "Run sovrapposte"): il gruppo
    # "pages" e' anche nel job "deploy", che parte appena questo finisce.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      pending_ok: ${{ steps.pending.outputs.ok }}
      nothing: ${{ steps.assemble.outputs.nothing }}
      site_sha256: ${{ steps.site-hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # I dati che richiedono un'app piu' recente (min-app-version-code, vedi assemble-site.sh) non
      # si pubblicano prima di quell'app: le installazioni esistenti bloccherebbero i download
      # chiedendo un aggiornamento che non c'e' ancora. versionCode rilasciato = app-status.json
      # (publish-apk.yml), lo stesso che legge il controllo aggiornamenti sul dispositivo.
      - name: Controlla che l'app richiesta dai dati sia gia' rilasciata
        run: |
          set -euo pipefail
          MIN_APP_VERSION_CODE="$(tr -dc '0-9' < tools/data-pipeline/min-app-version-code)"
          [[ "$MIN_APP_VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "min-app-version-code non valido: non pubblico" >&2; exit 1; }
          source .github/scripts/retry.sh
          APP_STATUS="$(retry curl -sSfL --max-time 120 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/app-status/app-status.json")"
          RELEASED_VERSION_CODE="$(jq -r '.appVersion.versionCode // empty' <<< "$APP_STATUS")"
          if ! [[ "$RELEASED_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "versionCode dell'app rilasciata non trovato in app-status.json: non pubblico" >&2
            exit 1
          fi
          if [ "$MIN_APP_VERSION_CODE" -gt "$RELEASED_VERSION_CODE" ]; then
            echo "min-app-version-code ($MIN_APP_VERSION_CODE) e' maggiore del versionCode dell'app rilasciata ($RELEASED_VERSION_CODE): rilasciare prima l'app (publish-apk.yml), poi ripubblicare i dati" >&2
            exit 1
          fi
          echo "-- min-app-version-code $MIN_APP_VERSION_CODE, app rilasciata $RELEASED_VERSION_CODE: ok"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: manifest-fragments-*
          path: ${{ runner.temp }}/fragments
          merge-multiple: true
        continue-on-error: true

      # Indici dei civici e dei mezzi pubblici (non frammenti di catalogo: fuori dal merge sopra), solo se il job li ha
      # prodotti: in una continuazione e' saltato, e il download fallito finiva tra gli errori della run. Senza, si
      # ripubblica l'indice precedente (assemble.sh).
      - if: needs.address-grid.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: address-grid-index
          path: ${{ runner.temp }}/address-grid-index
        continue-on-error: true

      - if: needs.transit.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: transit-index
          path: ${{ runner.temp }}/transit-index
        continue-on-error: true

      - uses: ./.github/actions/setup-pipeline

      # Frammenti in sospeso (release region-fragments): quelli di questa run, ma anche di run
      # annullate o morte prima di pubblicare. selectFragments (in assemble.sh) tiene solo quelli piu'
      # recenti del pubblicato. Senza questo elenco la pulizia degli asset non gira: cancellerebbe
      # gli asset di regioni costruite e non ancora pubblicate.
      - name: Scarica i frammenti in sospeso
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          PENDING_DIR="$RUNNER_TEMP/pending-fragments"
          mkdir -p "$PENDING_DIR"
          if ! NAMES="$(retry gh release view region-fragments --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"; then
            echo "::warning::release region-fragments non leggibile: niente recupero, e niente pulizia degli asset in questa run"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$NAMES" ]; then
            retry gh release download region-fragments --repo "$GITHUB_REPOSITORY" --pattern '*.json' --dir "$PENDING_DIR" --clobber
          fi
          COUNT="$(find "$PENDING_DIR" -name '*.json' | wc -l)"
          EXPECTED="$(grep -c '\.json$' <<< "$NAMES" || true)"
          echo "-- $COUNT frammenti in sospeso scaricati su $EXPECTED"
          # gh legge tutti gli asset, ma se ne manca qualcuno la
          # pulizia cancellerebbe i suoi file: si pubblicano quelli scaricati, senza pulizia.
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::warning::scaricati $COUNT frammenti in sospeso su $EXPECTED: niente pulizia degli asset in questa run"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Assembla il sito
        id: assemble
        # Input dall'ambiente, non interpolato nello script.
        env:
          ONLY_INPUT: ${{ github.event.inputs.only }}
        run: bash .github/scripts/publish-regions/assemble.sh

      - name: Valida il catalogo prima del deploy
        if: steps.assemble.outputs.nothing != 'true'
        env:
          SITE_DIR: ${{ steps.assemble.outputs.site_dir }}
          PAGES_HOST: ${{ steps.assemble.outputs.pages_host }}
        run: |
          set -euo pipefail
          ARGS="$SITE_DIR/manifest.json $PAGES_HOST"
          [ ! -s "$SITE_DIR/address-grid.json" ] || ARGS="$ARGS $SITE_DIR/address-grid.json"
          [ ! -s "$SITE_DIR/transit.json" ] || ARGS="$ARGS --transit $SITE_DIR/transit.json"
          ./gradlew --no-daemon -q :tools:data-pipeline:content:validateManifest --args="$ARGS"

      # Prima del deploy: ogni regione del `manifest.json` precedente deve restare nel nuovo, salvo quelle
      # che il merge toglie di proposito (fuori da regions.sh, o sostituite da un gruppo ormai
      # completo e quindi in "replacedRegions", vedi knownRegionIds/replacedRegions in
      # MergeManifests.kt). Altrimenti e' quasi certamente un merge incompleto: pubblicarlo farebbe
      # sparire regioni dall'app e la pulizia ne cancellerebbe gli asset.
      - name: Controlla che il nuovo manifest.json non perda regioni
        if: steps.assemble.outputs.nothing != 'true'
        env:
          MANIFEST: ${{ steps.assemble.outputs.site_dir }}/manifest.json
        run: |
          set -euo pipefail
          PREVIOUS_MANIFEST="$RUNNER_TEMP/previous-manifest.json"
          if [ ! -s "$PREVIOUS_MANIFEST" ]; then
            if [ ! -e "$RUNNER_TEMP/first-publication" ]; then
              echo "::error::manifest.json precedente mancante senza che sia una prima pubblicazione: confronto sulle regioni impossibile" >&2
              exit 1
            fi
            echo "::warning::manifest.json precedente non disponibile: nessun confronto sulle regioni"
            exit 0
          fi
          source tools/data-pipeline/scripts/regions.sh
          KNOWN="$RUNNER_TEMP/known-regions.txt"
          for spec in "${ALL_REGIONS[@]}" "${REPLACED_REGIONS[@]}"; do echo "${spec%%|*}"; done | sort -u > "$KNOWN"
          MISSING="$(jq -r --rawfile known "$KNOWN" --slurpfile new "$MANIFEST" '
            ($known | split("\n") | map(select(length > 0))) as $k
            | ([$new[0].regions[].regionId] + [($new[0].replacedRegions // [])[].regionId]) as $kept
            | [(.regions // [])[].regionId | select(IN($k[]) and (IN($kept[]) | not))] | join(" ")
          ' "$PREVIOUS_MANIFEST")"
          if [ -n "$MISSING" ]; then
            echo "Il nuovo manifest.json ha perso regioni ancora nell'elenco: $MISSING. Non pubblico" >&2
            exit 1
          fi
          echo "-- nessuna regione persa ($(jq '.regions | length' "$PREVIOUS_MANIFEST") prima, $(jq '.regions | length' "$MANIFEST") ora)"

      # Impronta del sito assemblato (sha256 dell'elenco "sha256 percorso" di tutti i file, in ordine): il job "deploy" la
      # ricalcola sull'artifact scaricato e non firma un sito diverso da quello controllato qui.
      - name: Calcola l'impronta del sito
        if: steps.assemble.outputs.nothing != 'true'
        id: site-hash
        env:
          SITE_DIR: ${{ steps.assemble.outputs.site_dir }}
        run: |
          set -euo pipefail
          SITE_SHA256="$(cd "$SITE_DIR" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "-- impronta del sito: $SITE_SHA256"
          echo "sha256=$SITE_SHA256" >> "$GITHUB_OUTPUT"

      # Il sito assemblato (senza firma) va al job "deploy"; gli elenchi di cui hanno bisogno i passi dopo il deploy
      # (frammenti in sospeso scaricati sopra e cataloghi precedenti) vanno al job "after-deploy". Nome fisso con
      # overwrite: un rilancio del solo job che li legge non cerca un nome di un altro tentativo.
      - name: Carica il sito da firmare e pubblicare
        if: steps.assemble.outputs.nothing != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-to-publish
          path: ${{ steps.assemble.outputs.site_dir }}
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Carica gli elenchi per i passi dopo il deploy
        if: steps.assemble.outputs.nothing != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: after-deploy-inputs
          path: |
            ${{ runner.temp }}/pending-fragments
            ${{ runner.temp }}/previous-*.json
            ${{ runner.temp }}/first-publication
          overwrite: true
          retention-days: 1

      # Il daemon di Gradle avviato da assemble-site.sh (mergeManifests) non resta vivo a fine job.
      - name: Ferma i daemon di Gradle
        if: ${{ always() }}
        continue-on-error: true
        run: ./gradlew --stop

  # Firma i JSON del sito e fa il deploy su Pages. Sta a parte perche' MANIFEST_SIGNING_KEY e' la chiave con cui si
  # fanno accettare dati falsi a tutte le app installate, e non deve trovarsi sul runner di "publish": li' gira Gradle
  # (un daemon puo' restare vivo) insieme agli script della pipeline, che elaborano dati di terzi. Questo job scarica
  # il sito gia' assemblato e non esegue ne' Gradle ne' script della pipeline: solo jq, openssl e sign-files.sh, la cui
  # copia viene dal checkout (senza credenziali: persist-credentials: false), con SyncConfig.kt per la chiave pubblica
  # ufficiale. La chiave e' nell'ambiente solo del passo che firma. Gruppo "pages" ed environment come prima del
  # deploy: il gruppo si prende appena "publish" finisce, quindi un'altra run non fa in tempo a fondere un catalogo
  # nel frattempo.
  deploy:
    name: Firma e deploy
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.nothing != 'true' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-to-publish
          path: ${{ runner.temp }}/site

      - name: Controlla l'impronta del sito
        env:
          SITE_DIR: ${{ runner.temp }}/site
          EXPECTED_SHA256: ${{ needs.publish.outputs.site_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_SHA256="$(cd "$SITE_DIR" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          if [ -z "$EXPECTED_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::il sito scaricato ($ACTUAL_SHA256) non e' quello assemblato da \"publish\" (${EXPECTED_SHA256:-impronta mancante}): non firmo" >&2
            exit 1
          fi
          echo "-- impronta del sito: $ACTUAL_SHA256, uguale a quella di \"publish\""

      # Indice e voce di `manifest.json` vengono da download diversi (artifact, in continue-on-error, o indice
      # gia' pubblicato) e potrebbero non corrispondere: l'app scarterebbe l'indice per lo sha256 diverso.
      - name: Controlla che gli indici corrispondano a manifest.json
        env:
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          for entry in addressGrid:address-grid.json transit:transit.json; do
            key="${entry%%:*}"
            file="$SITE_DIR/${entry#*:}"
            [ -s "$file" ] || continue
            expected="$(jq -r --arg key "$key" '.[$key].sha256 // empty' "$SITE_DIR/manifest.json")"
            [ -n "$expected" ] || continue
            actual="$(sha256sum "$file" | cut -d' ' -f1)"
            if [ "$expected" != "$actual" ]; then
              echo "::error::${entry#*:} ($actual) non corrisponde a $key.sha256 di manifest.json ($expected): non pubblico" >&2
              exit 1
            fi
          done

      # Firma ECDSA P-256 / SHA-256 dei JSON che l'app scarica dal sito (<nome>.json.sig accanto, DER):
      # dopo l'ultima modifica ai file e prima del deploy. Senza il secret MANIFEST_SIGNING_KEY il job fallisce, vedi
      # sign-files.sh. La chiave e' nell'ambiente solo di questo passo.
      - name: Firma i file JSON del sito
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          # publishedAt (secondi Unix) in `manifest.json`, prima della firma: l'app rifiuta un valore piu' basso
          # dell'ultimo accettato (niente ritorno a una vecchia coppia file + .sig). address-grid.json e
          # transit.json lo hanno gia' dalla generazione (il loro sha256 e' in `manifest.json`, non si toccano qui).
          jq --argjson at "$(date +%s)" '.publishedAt = $at' "$SITE_DIR/manifest.json" > "$RUNNER_TEMP/manifest-stamped.json"
          mv "$RUNNER_TEMP/manifest-stamped.json" "$SITE_DIR/manifest.json"
          FILES=("$SITE_DIR/manifest.json")
          # address-grid.json e transit.json ci sono solo se gia' pubblicati o prodotti da questa run.
          for name in address-grid.json transit.json; do
            [ ! -s "$SITE_DIR/$name" ] || FILES+=("$SITE_DIR/$name")
          done
          bash .github/scripts/sign-files.sh "${FILES[@]}"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Un nome per tentativo: ogni rilancio di una run carica un altro artefatto nella stessa
      # run, e deploy-pages rifiuta di pubblicare se ne trova piu' d'uno con lo stesso nome
      # ("Multiple artifacts named github-pages", run del 2026-09-21 al terzo tentativo).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # Passi che vengono dopo il deploy. Job a parte, senza la chiave di firma: tengono il token che scrive sulle release e
  # lancia i workflow.
  # - Continuazione automatica delle regioni rimandate per il budget di tempo (e di quelle fallite, solo dalla run
  #   iniziale). Gira anche se il deploy o "publish" sono falliti: le regioni rimandate non sono state tentate.
  # - Frammenti in sospeso gestiti: dopo il deploy quelli scaricati da "publish" sono tutti sistemati (uniti, gia'
  #   superati dal pubblicato, scaduti o non validi). Si tolgono solo quelli scaricati: una run in corso puo' averne
  #   caricati altri nel frattempo.
  # - Catalogo appena pubblicato e catalogo precedente per il job "cleanup": solo dopo il deploy (i vecchi URL restano
  #   in uso fino ad allora) e con l'elenco dei frammenti in sospeso; senza, la pulizia cancellerebbe gli asset di
  #   regioni costruite e non ancora pubblicate (li recupera una run successiva).
  after-deploy:
    name: Dopo il deploy
    needs: [publish, deploy]
    # Non gira se "publish" non aveva niente da pubblicare (nothing=true, solo con only guides, world-map, addresses o
    # transit): senza regioni costruite non c'e' niente da rilanciare, e senza deploy non ci sono frammenti da togliere
    # ne' cataloghi per la pulizia (il job "cleanup" salta di conseguenza).
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.publish.outputs.nothing != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # contents: write per togliere i frammenti in sospeso gestiti; actions: write per rilanciare le regioni rimandate.
    permissions:
      contents: write
      actions: write
    outputs:
      cleanup: ${{ steps.cleanup-inputs.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Elenchi delle regioni rimandate e fallite (deferred-*.txt, failed-*.txt) degli shard.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: manifest-fragments-*
          path: ${{ runner.temp }}/fragments
          merge-multiple: true
        continue-on-error: true

      - name: Rilancia le regioni rimandate
        id: continue
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          CONTINUATION: ${{ github.event.inputs.continuation }}
          TIME_BUDGET_INPUT: ${{ github.event.inputs.time_budget_minutes }}
          POI_MAX_AGE_INPUT: ${{ github.event.inputs.poi_max_age_days }}
          FORCE_CITIES_INPUT: ${{ github.event.inputs.force_cities }}
        run: bash .github/scripts/publish-regions/continue-deferred.sh

      # Gli estratti di Geofabrik servono solo alle run dello stesso giorno (continuazioni e rilanci): li toglie l'ultima
      # run della catena, quella che non lancia una continuazione, cosi' non occupano circa 1,5 GB della cache fino alla
      # run del giorno dopo. Un rilancio a mano piu' tardi li riscarica da Geofabrik. Una run che non costruisce regioni
      # (input only) non li tocca: possono servire a una catena ancora in corso.
      - name: Elimina le cache degli estratti di Geofabrik
        if: ${{ !cancelled() && steps.continue.outputs.launched != 'true' && contains(fromJSON('["all","regions"]'), github.event.inputs.only || 'all') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key geofabrik-poi- --limit 100 --json key --jq '.[].key' \
            | while read -r key; do gh cache delete "$key" --repo "$GITHUB_REPOSITORY" || echo "::warning::cache $key non tolta"; done

      - if: needs.deploy.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-to-publish
          path: ${{ runner.temp }}/site

      - if: needs.deploy.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: after-deploy-inputs
          path: ${{ runner.temp }}/after-deploy-inputs

      - name: Togli i frammenti in sospeso gestiti
        if: needs.deploy.result == 'success' && needs.publish.outputs.pending_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          removed=0
          for f in "$RUNNER_TEMP/after-deploy-inputs/pending-fragments"/*.json; do
            if gh release delete-asset region-fragments "$(basename "$f")" --repo "$GITHUB_REPOSITORY" --yes; then
              removed=$((removed + 1))
            fi
          done
          echo "-- $removed frammenti tolti da region-fragments"

      - name: Prepara i cataloghi per la pulizia degli asset
        id: cleanup-inputs
        if: needs.deploy.result == 'success' && needs.publish.outputs.pending_ok == 'true'
        env:
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/cleanup/site" "$RUNNER_TEMP/cleanup/previous"
          for name in manifest.json address-grid.json transit.json; do
            [ ! -s "$SITE_DIR/$name" ] || cp "$SITE_DIR/$name" "$RUNNER_TEMP/cleanup/site/"
          done
          for f in "$RUNNER_TEMP"/after-deploy-inputs/previous-*.json "$RUNNER_TEMP/after-deploy-inputs/first-publication"; do
            [ ! -e "$f" ] || cp "$f" "$RUNNER_TEMP/cleanup/previous/"
          done

      - name: Carica i cataloghi per la pulizia degli asset
        if: steps.cleanup-inputs.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-cleanup-inputs
          path: ${{ runner.temp }}/cleanup
          retention-days: 1

  # Toglie dalle release gli asset che il catalogo appena pubblicato (e quello precedente) non referenziano piu'
  # (cleanup-assets.sh): migliaia di DELETE, una per asset, fino a 15 minuti. Job a parte dopo "deploy" e
  # "after-deploy" (che ne prepara gli input), cosi' il gruppo "pages" si libera subito dopo il deploy; il gruppo
  # "asset-cleanup" tiene una pulizia alla volta.
  # Il `success()` implicito di `if` guarda tutta la catena dei needs: senza l'espressione esplicita il job salterebbe
  # quando un job a monte di "publish" e' saltato o fallito. Le continuazioni non puliscono: cleanup-assets.sh protegge
  # solo il catalogo nuovo e il precedente (piu' gli asset delle ultime 24 ore), e una continuazione pubblica un catalogo
  # pochi minuti dopo quello della run principale, quindi cancellerebbe asset del catalogo di prima ancora in uso
  # dalle app.
  cleanup:
    name: Pulizia degli asset
    needs: [deploy, after-deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.after-deploy.result == 'success' && needs.after-deploy.outputs.cleanup == 'true' && !(github.event.inputs.continuation > 0) }}
    concurrency:
      group: asset-cleanup
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-cleanup-inputs
          path: ${{ runner.temp }}/cleanup

      - name: Rimuovi gli asset non piu' referenziati dal catalogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-regions/cleanup-assets.sh "$RUNNER_TEMP/cleanup/site" "$RUNNER_TEMP/cleanup/previous"
