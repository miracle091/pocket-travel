name: Publish regions

# Pubblica manifest.json su GitHub Pages; i pacchetti (guides.db unico per tutte le
# regioni, poi.db e segmenti .rd5 per regione: il grosso dei dati) vanno invece sugli asset delle
# release "region-data*" - GitHub Pages ha un limite fisso di 1GB per l'intero sito, sforato con la
# copertura mondiale di pilot-regions.sh (254 regioni), gli asset di una release no. map.pmtiles
# non e' mai un file da ospitare (estratto lato device dalla build Protomaps, vedi
# PmtilesExtractor); i segmenti .rd5 invece sono ri-ospitati insieme a poi.db (non solo
# referenziati su brouter.de) perche' quel file cambia dimensione/hash nel tempo — vedi il
# commento in testa a tools/data-pipeline/scripts/build-region.sh.
#
# Il pacchetto guide (job "guides") si rigenera a ogni run per tutte le regioni: e' piccolo, e
# build-guides.sh pubblica una nuova versione solo se il contenuto e' cambiato. Ogni regione porta
# anche un'anteprima offline a pochi zoom (preview.pmtiles, stesso trattamento di poi.db - vedi
# build-region.sh) e il manifest ha in cima "worldMap": mappa del mondo online a bassa risoluzione
# (job "world-map"), sulla release "world-map", rigenerata solo ogni ~30 giorni o se assente (vedi
# .claude/docs/map-preview-online-plan.md).
#
# Trigger: 7 righe schedule (una per giorno) rigenerano automaticamente il bucket del giorno
# (tools/data-pipeline/scripts/weekly-schedule.sh, generato da generate-weekly-schedule.sh —
# cadenza settimanale perche' i segmenti .rd5 di BRouter vengono rigenerati settimanalmente, non ha senso
# ripubblicare piu' spesso). workflow_dispatch resta disponibile per run manuali/mirate (regions
# esplicito) o per rigenerare tutto il lotto (regions vuoto, fuori da uno schedule).
#
# Il lavoro e' spalmato su piu' giorni (bucket) E, dentro ogni bucket, su piu' shard in parallelo
# (matrice a 3 vie) per due limiti concreti, non teorici:
#   1. limite di 6h per job di GitHub Actions
#   2. fair use dei mirror Overpass pubblici (infrastruttura gratuita condivisa, non nostra)
# Lo split fra shard e' bilanciato per peso (i secondi dell'ultima generazione di ogni regione,
# region-timings.tsv sul sito; senza misura le tile land di WEEKLY_SCHEDULE_TILES) e non un semplice round-robin per indice: senza bilanciamento, piu'
# regioni "gigante" (canada, stati-uniti, russia, brasile, cina, india, ...) capitate per caso nello
# stesso bucket-giorno potevano finire nello stesso shard, rischiando di sforare il limite di 6h
# mentre gli altri shard restavano quasi vuoti.
on:
  schedule:
    - cron: '0 2 * * 1'  # lunedi - bucket giorno 1 (piu' visitate)
    - cron: '0 2 * * 2'  # martedi - bucket giorno 2
    - cron: '0 2 * * 3'  # mercoledi - bucket giorno 3
    - cron: '0 2 * * 4'  # giovedi - bucket giorno 4
    - cron: '0 2 * * 5'  # venerdi - bucket giorno 5
    - cron: '0 2 * * 6'  # sabato - bucket giorno 6
    - cron: '0 2 * * 0'  # domenica - bucket giorno 7 (meno visitate)
  workflow_dispatch:
    inputs:
      regions:
        description: >
          regionId da (ri)generare in questa run, separati da virgola (vedi
          tools/data-pipeline/scripts/pilot-regions.sh per l'elenco completo).
          Vuoto = tutto il lotto pilota.
        required: false
        default: ""
      poi_max_age_days:
        description: >
          Eta' massima (giorni) di un poi.db pubblicato prima di rigenerarlo (POI_MAX_AGE_DAYS di
          build-region.sh). 0 = rigenera i POI delle regioni scelte anche se recenti. Vuoto = 6,
          cioe' POI rinnovati a ogni turno settimanale della regione.
        required: false
        default: ""

# Minimo a livello di workflow: contents: write solo ai job che creano release o ne caricano/tolgono
# asset, pages/id-token solo al job "publish" che fa il deploy su Pages.
permissions:
  contents: read

# Nessuna concurrency a livello di workflow: un gruppo tiene al massimo una run in corso e UNA in
# attesa, e una nuova run in coda annulla quella gia' in attesa (anche con cancel-in-progress:
# false). Con run che durano ore, una run manuale lanciata durante uno schedule poteva far annullare
# il bucket del giorno successivo rimasto in coda. Il gruppo "pages" sta solo sul job "publish"
# (pochi minuti: la finestra in cui una terza run puo' scavalcarne una in attesa e' minima). I job
# di generazione di run diverse possono quindi sovrapporsi: gli asset non si scontrano (VERSION
# unica per run, vedi job "build") e la pulizia nel job "publish" non tocca gli asset caricati da
# meno di 24 ore, che possono appartenere a una run ancora in corso.

env:
  # Unica per tutta la run, riusata dai job "build" e "publish" (prima ricostruita identica in
  # entrambi da github.repository_owner/github.event.repository.name).
  PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  # Determina l'elenco di regioni da processare in questa run (bucket del giorno, input manuale,
  # o tutto il lotto) e lo divide in 3 shard per il job a matrice sotto.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      shard0: ${{ steps.plan.outputs.shard0 }}
      shard1: ${{ steps.plan.outputs.shard1 }}
      shard2: ${{ steps.plan.outputs.shard2 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Gira qui (una volta, prima della matrice) e non dentro il job "build": se lo shard 0/1/2
      # eseguissero tutti "gh release view || gh release create" in parallelo, alla primissima run
      # in assoluto (release ancora inesistente) andrebbero in race - il secondo "gh release
      # create" a completare fallirebbe perche' un altro shard ha gia' creato la release nel
      # frattempo, facendo fallire quello shard senza motivo.
      - name: Assicura le release che ospitano i pacchetti regionali
        shell: bash
        run: |
          set -euo pipefail
          source tools/data-pipeline/scripts/pilot-regions.sh
          # Una release per continente ("region-data-<slug>"): GitHub limita ogni release a 1000
          # asset e la sola release "region-data" con i pacchetti di 254 regioni li ha
          # sforati (HTTP 422 "file_count limited to 1000 assets per release"). Le regioni gia'
          # pubblicate restano raggiungibili sulla vecchia release "region-data" (URL nel manifest).
          # Asia e Africa sono divise in piu' release, vedi region_release_tag in pilot-regions.sh.
          declare -A SEEN=()
          for spec in "${PILOT_REGIONS[@]}"; do
            IFS='|' read -r regionId _ _ _ _ _ _ _ _ _ continent <<< "$spec"
            tag="$(region_release_tag "$regionId" "$continent")"
            [ -z "${SEEN[$tag]:-}" ] || continue
            SEEN[$tag]=1
            gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
              gh release create "$tag" --repo "${{ github.repository }}" \
                --title "Dati regionali (${tag#region-data-})" \
                --notes "Asset binari (poi.db + segmenti .rd5) per l'app Pocket Travel, referenziati da manifest.json su GitHub Pages. Non e' una release software."
          done
          # Release del pacchetto guide unico: stesso prefisso "region-data" cosi' la pulizia degli
          # asset non piu' referenziati nel job "publish" la copre senza casi speciali.
          gh release view "region-data-guide" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "region-data-guide" --repo "${{ github.repository }}" \
              --title "Guide di viaggio" \
              --notes "guides.db (guide Wikivoyage e numeri di emergenza di tutte le regioni) per l'app Pocket Travel, referenziato da manifest.json su GitHub Pages. Non e' una release software."

      - name: Determina le regioni della run e gli shard
        id: plan
        shell: bash
        # L'input arriva da env, non interpolato nello script (niente iniezione di comandi).
        env:
          REGIONS_INPUT: ${{ github.event.inputs.regions }}
        run: |
          set -euo pipefail
          source tools/data-pipeline/scripts/pilot-regions.sh
          # Serve sempre (non solo nel ramo schedule sotto): WEEKLY_SCHEDULE_TILES e' il peso per
          # regione riusato piu' in basso per bilanciare gli shard.
          source tools/data-pipeline/scripts/weekly-schedule.sh

          # Spazi tolti ("italia, francia" -> "italia,francia"); ogni regionId deve essere un id
          # valido, perche' finisce negli output del job e da li' negli script del job "build".
          SELECTED="$(printf '%s' "${REGIONS_INPUT:-}" | tr -d '[:space:]')"
          if [ -n "$SELECTED" ] && ! [[ "$SELECTED" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then
            echo "regions non valido: '$SELECTED' (regionId separati da virgola, solo a-z, 0-9 e -)" >&2
            exit 1
          fi
          if [ -z "$SELECTED" ] && [ -n "${{ github.event.schedule }}" ]; then
            # github.event.schedule e' la stringa cron esatta che ha innescato la run (una delle 7
            # sopra): l'ultimo campo e' il giorno della settimana cron (0=domenica..6=sabato).
            # weekly-schedule.sh usa invece 1=lunedi..7=domenica (piu' naturale per un bucket
            # "giorno N della settimana lavorativa+weekend"), da cui il rimappaggio di 0 a 7.
            SCHEDULE="${{ github.event.schedule }}"
            DOW="${SCHEDULE##* }"
            [ "$DOW" = "0" ] && DOW=7
            varName="WEEKLY_SCHEDULE_DAY_${DOW}"
            SELECTED="${!varName}"
            echo "-- trigger schedule ($SCHEDULE): bucket del giorno $DOW"
          fi
          if [ -z "$SELECTED" ]; then
            # workflow_dispatch senza regions esplicite (fuori da uno schedule): tutto il lotto,
            # comportamento storico prima dell'introduzione dei bucket.
            ids=()
            for spec in "${PILOT_REGIONS[@]}"; do
              IFS='|' read -r regionId _ <<< "$spec"
              ids+=("$regionId")
            done
            SELECTED="$(IFS=,; echo "${ids[*]}")"
          fi
          echo "-- regioni selezionate: $SELECTED"

          # Sharding a matrice in 3 shard fissi, bilanciato per peso (non un semplice round-robin
          # per indice, vedi commento in testa al file): le regioni selezionate vengono ordinate
          # per tile land decrescente (WEEKLY_SCHEDULE_TILES) e assegnate una a una, dalla piu'
          # pesante alla piu' leggera, allo shard con il carico cumulativo piu' basso al momento
          # (bin-packing goloso, stesso principio di generate-weekly-schedule.sh ma sui 3 shard
          # invece che sui 7 giorni). Regioni non presenti in WEEKLY_SCHEDULE_TILES (non dovrebbe
          # succedere: e' generato dallo stesso pilot-regions.sh) pesano 0. Per run piccole/manuali
          # uno o due shard possono restare vuoti - il job "build" per quello shard non fa nulla e
          # termina subito (vedi sotto), non e' un errore.
          # Peso = secondi dell'ultima generazione completa della regione (region-timings.tsv,
          # pubblicato accanto al manifest dal job "publish"): le tile contano poco per i POI,
          # rigenerati ogni settimana e lunghi dove i punti sono tanti (Germania: poche tile, molti
          # POI). Senza misura: 12 s per tile land, la media della run completa del 2026-09-24.
          declare -A TIMINGS=()
          if curl -sSfL -A "PocketTravelDataPipeline/1.0" "${{ env.PAGES_BASE_URL }}/region-timings.tsv" -o "$RUNNER_TEMP/region-timings.tsv"; then
            while IFS=$'\t' read -r regionId seconds; do
              [[ "$seconds" =~ ^[0-9]+$ ]] && TIMINGS[$regionId]="$seconds"
            done < "$RUNNER_TEMP/region-timings.tsv"
          fi
          echo "-- tempi misurati per ${#TIMINGS[@]} regioni"
          IFS=',' read -ra REGION_ARR <<< "$SELECTED"
          SORTED_FILE="$RUNNER_TEMP/sorted-regions.tsv"
          for r in "${REGION_ARR[@]}"; do
            printf '%d\t%s\n' "${TIMINGS[$r]:-$(( ${WEEKLY_SCHEDULE_TILES[$r]:-1} * 12 ))}" "$r"
          done | sort -t $'\t' -k1,1nr > "$SORTED_FILE"

          SHARD_COUNT=3
          declare -a SHARDS
          declare -a SHARD_LOAD
          for ((n = 0; n < SHARD_COUNT; n++)); do SHARDS[$n]=""; SHARD_LOAD[$n]=0; done
          while IFS=$'\t' read -r weight regionId; do
            lightest=0
            for ((n = 1; n < SHARD_COUNT; n++)); do
              [ "${SHARD_LOAD[$n]}" -lt "${SHARD_LOAD[$lightest]}" ] && lightest=$n
            done
            if [ -z "${SHARDS[$lightest]}" ]; then SHARDS[$lightest]="$regionId"; else SHARDS[$lightest]="${SHARDS[$lightest]},$regionId"; fi
            SHARD_LOAD[$lightest]=$((SHARD_LOAD[$lightest] + weight))
          done < "$SORTED_FILE"
          echo "-- carico stimato per shard (secondi): ${SHARD_LOAD[0]}, ${SHARD_LOAD[1]}, ${SHARD_LOAD[2]}"

          echo "shard0=${SHARDS[0]}" >> "$GITHUB_OUTPUT"
          echo "shard1=${SHARDS[1]}" >> "$GITHUB_OUTPUT"
          echo "shard2=${SHARDS[2]}" >> "$GITHUB_OUTPUT"

  # Genera il pacchetto guide unico (guides.db) e il suo frammento manifest. Un solo job, non
  # sharded: sono poche centinaia di pagine Wikivoyage di pochi KB ciascuna.
  guides:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Genera guides.db
        shell: bash
        run: |
          set -euo pipefail
          # Data + numero e tentativo della run: unica per run, come nel job "build" (vedi li').
          VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}.${{ github.run_attempt }}"
          OUT="$RUNNER_TEMP/guides-out"
          tools/data-pipeline/scripts/build-guides.sh "$VERSION" \
            "https://github.com/${{ github.repository }}/releases/download/region-data-guide" "$OUT" \
            "${{ env.PAGES_BASE_URL }}/manifest.json"
          if [ -f "$OUT/guides.db.xz" ]; then
            asset="$OUT/guides--${VERSION}--guides.db.xz"
            cp "$OUT/guides.db.xz" "$asset"
            gh release upload region-data-guide "$asset" --repo "${{ github.repository }}" --clobber
          fi
          mkdir -p "$RUNNER_TEMP/fragments"
          cp "$OUT/manifest-fragment.json" "$RUNNER_TEMP/fragments/guides.json"

      - name: Carica il frammento manifest delle guide
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-fragments-guides
          path: ${{ runner.temp }}/fragments/guides.json
          retention-days: 1

  # Mappa del mondo online a bassa risoluzione (z0-8, ~555 MB), sulla release "world-map": letta
  # dall'app a pezzi con richieste Range quando la mappa di una regione non e' scaricata ma c'e'
  # rete (vedi .claude/docs/map-preview-online-plan.md, "Decisioni" del 2026-09-27). Un solo job,
  # non sharded: un solo file per l'intero pianeta. Si rigenera solo se quella pubblicata ha piu' di
  # WORLD_MAP_MAX_AGE_DAYS giorni o manca del tutto - altrimenti il job non produce nulla e la voce
  # gia' pubblicata resta (mergeManifests la riporta avanti dal manifest online, come "guides").
  world-map:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      WORLD_MAP_MAX_AGE_DAYS: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # go-pmtiles: stessa versione e installazione del job "build" sotto.
      - name: Installa go-pmtiles
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/go-pmtiles.tar.gz" https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          echo "3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  $RUNNER_TEMP/go-pmtiles.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/go-pmtiles.tar.gz" -C "$RUNNER_TEMP/bin" pmtiles
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Rigenera la mappa del mondo se serve
        id: build
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=./tools/data-pipeline/scripts/lib.sh
          source tools/data-pipeline/scripts/lib.sh
          PROTOMAPS_DATE="$(resolve_protomaps_date)"
          echo "-- build Protomaps: ${PROTOMAPS_DATE}.pmtiles"

          PUBLISHED_DATE=""
          if curl -sSfL "${{ env.PAGES_BASE_URL }}/manifest.json" -o "$RUNNER_TEMP/published-manifest.json" 2>/dev/null; then
            PUBLISHED_DATE="$(jq -r '.worldMap.version // ""' "$RUNNER_TEMP/published-manifest.json")"
          fi
          if [ -n "$PUBLISHED_DATE" ]; then
            AGE_DAYS="$(( ($(date -u +%s) - $(date -u -d "$PUBLISHED_DATE" +%s)) / 86400 ))"
            if [ "$AGE_DAYS" -le "$WORLD_MAP_MAX_AGE_DAYS" ]; then
              echo "-- mappa del mondo pubblicata il $PUBLISHED_DATE, $AGE_DAYS giorni fa (max $WORLD_MAP_MAX_AGE_DAYS): non la rigenero"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          gh release view world-map --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create world-map --repo "${{ github.repository }}" \
              --title "Mappa del mondo" \
              --notes "Mappa del mondo a bassa risoluzione (z0-8) per l'app Pocket Travel, letta online a pezzi. Non e' una release software."

          # Estratta direttamente col nome dell'asset: niente copia di un file da ~555 MB
          ASSET_NAME="world-${PROTOMAPS_DATE}-z8.pmtiles"
          ASSET="$RUNNER_TEMP/$ASSET_NAME"
          # Fino a 3 tentativi: build.protomaps.com a volte chiude la connessione a meta' download
          # (stesso problema dei civici, vedi with_retries in build-address-cell.sh).
          for attempt in 1 2 3; do
            rm -f "$ASSET"
            pmtiles extract "https://build.protomaps.com/${PROTOMAPS_DATE}.pmtiles" "$ASSET" --maxzoom=8 && break
            [ "$attempt" -lt 3 ] || { echo "Estrazione della mappa del mondo fallita dopo 3 tentativi" >&2; exit 1; }
            echo "-- estrazione della mappa del mondo fallita (tentativo $attempt/3), riprovo tra $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          gh release upload world-map "$ASSET" --repo "${{ github.repository }}" --clobber

          SIZE="$(wc -c < "$ASSET" | tr -d ' ')"
          mkdir -p "$RUNNER_TEMP/fragments"
          jq -n -c --arg version "$PROTOMAPS_DATE" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/world-map/$ASSET_NAME" --argjson size "$SIZE" \
            '{manifestVersion: 2, worldMap: {version: $version, maxZoom: 8, url: $url, sizeBytes: $size}, regions: []}' \
            > "$RUNNER_TEMP/fragments/world-map.json"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Carica il frammento manifest della mappa del mondo
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-fragments-world-map
          path: ${{ runner.temp }}/fragments/world-map.json
          retention-days: 1

  # Celle della griglia adattiva dei civici (OSM + Overture, vedi .claude/docs/address-grid-plan.md):
  # una quota giornaliera (hash stabile dell'id mod 30, come un calendario a 30 giorni) cosi' ogni
  # cella si ricostruisce al piu' ogni 30 giorni - build-address-cell.sh ha comunque il proprio
  # controllo d'eta' come le regioni, quindi una quota imprecisa e' innocua, solo un po' di lavoro
  # sprecato. Un solo job (non a matrice): con ~1.640 celle nel seme una quota di 1/30 (circa 55
  # celle) impiega poche decine di minuti, ben sotto il limite di 6h. Le celle vivono sulle release
  # "address-cells-<n>" (n = hash stabile dell'id mod 6, stesso motivo del limite di 1000 asset per
  # release di region_release_tag in pilot-regions.sh) invece che su "region-data*": non sono
  # legate a una regione. L'indice (address-grid.json) e il suo frammento manifest (voce
  # "addressGrid") vanno al job "publish" come artifact, stesso schema di "guides"/"world-map".
  address-grid:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHON_BIN: python3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # go-pmtiles: stessa versione e installazione del job "build" sotto.
      - name: Installa go-pmtiles
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/go-pmtiles.tar.gz" https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          echo "3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  $RUNNER_TEMP/go-pmtiles.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/go-pmtiles.tar.gz" -C "$RUNNER_TEMP/bin" pmtiles
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # duckdb (con httpfs/spatial, caricate a runtime da overture_addresses.py): niente versione
      # fissata via hash, e' un pacchetto Python puro installato ad ogni run, come il resto del
      # toolchain Python di questo job (nessun requirements.txt nel pipeline oggi).
      - name: Installa duckdb
        shell: bash
        run: python3 -m pip install --quiet --disable-pip-version-check duckdb

      - name: Assicura le release delle celle
        shell: bash
        run: |
          set -euo pipefail
          for n in 0 1 2 3 4 5; do
            gh release view "address-cells-$n" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
              gh release create "address-cells-$n" --repo "${{ github.repository }}" \
                --title "Civici a celle ($n/6)" \
                --notes "Asset binari (celle addresses.pmtiles.xz della griglia adattiva dei civici) per l'app Pocket Travel, referenziati da address-grid.json su GitHub Pages. Non e' una release software."
          done

      - name: Costruisci la quota di celle di oggi
        id: build
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=./tools/data-pipeline/scripts/lib.sh
          source tools/data-pipeline/scripts/lib.sh
          PAGES_BASE_URL="${{ env.PAGES_BASE_URL }}"
          INDEX_URL="$PAGES_BASE_URL/address-grid.json"

          # Partizione attuale: l'indice pubblicato (fonte di verita', include le celle divise da
          # run precedenti) o, alla primissima pubblicazione (404), il seme versionato nel repo.
          IDS_FILE="$RUNNER_TEMP/all-cell-ids.txt"
          PUBLISHED_INDEX_FILE="$RUNNER_TEMP/published-index.json"
          # File locale scaricato una volta per l'intero job (non uno per cella): passato cosi'
          # com'e' a build-address-cell.sh piu' sotto (fetch_published_manifest, lib.sh, accetta
          # un path al posto dell'URL).
          PUBLISHED_INDEX_ARG=""
          PUBLISHED_INDEX_HTTP="$(fetch_published_manifest "$INDEX_URL" "$PUBLISHED_INDEX_FILE")"
          if [ "$PUBLISHED_INDEX_HTTP" = "200" ]; then
            jq -r '.cells[].id' "$PUBLISHED_INDEX_FILE" > "$IDS_FILE"
            PUBLISHED_INDEX_ARG="$PUBLISHED_INDEX_FILE"
          elif [ "$PUBLISHED_INDEX_HTTP" = "404" ]; then
            cp tools/data-pipeline/address-grid-seed.tsv "$IDS_FILE"
            rm -f "$PUBLISHED_INDEX_FILE"
          else
            echo "ERRORE: indice civici non scaricabile da $INDEX_URL (HTTP ${PUBLISHED_INDEX_HTTP:-000})" >&2
            exit 1
          fi
          echo "-- $(wc -l < "$IDS_FILE") celle nella partizione attuale"

          # Slot 0..29 stabile per id (cksum: nessuna dipendenza in piu', basta per distribuire il
          # lavoro sui giorni - non serve crittografico). Giorni dall'epoca, non giorno del mese:
          # niente bias sui bordi del mese.
          TODAY_SLOT=$(( $(date -u +%s) / 86400 % 30 ))
          SELECTED_FILE="$RUNNER_TEMP/selected-cells.txt"
          : > "$SELECTED_FILE"
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            slot=$(( $(printf '%s' "$id" | cksum | cut -d' ' -f1) % 30 ))
            [ "$slot" -eq "$TODAY_SLOT" ] && echo "$id" >> "$SELECTED_FILE"
          done < "$IDS_FILE"
          echo "-- quota di oggi (slot $TODAY_SLOT/30): $(wc -l < "$SELECTED_FILE") celle"

          PROTOMAPS_DATE="$(resolve_protomaps_date)"
          SOURCE_URL="https://build.protomaps.com/${PROTOMAPS_DATE}.pmtiles"
          echo "-- build Protomaps: ${PROTOMAPS_DATE}.pmtiles"
          # Stesso rilascio Overture per tutte le celle della run (il piu' recente, risolto una volta).
          OVERTURE_RELEASE="$(python3 tools/data-pipeline/scripts/overture_addresses.py --print-release)"
          export OVERTURE_RELEASE
          echo "-- rilascio Overture: $OVERTURE_RELEASE"
          VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}.${{ github.run_attempt }}"

          ALL_ENTRIES="$RUNNER_TEMP/all-entries.jsonl"
          : > "$ALL_ENTRIES"
          FAILED_CELLS=()
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            n=$(( $(printf '%s' "$id" | cksum | cut -d' ' -f1) % 6 ))
            tag="address-cells-$n"
            CELL_OUT="$RUNNER_TEMP/cell-out"
            rm -rf "$CELL_OUT"
            mkdir -p "$CELL_OUT"
            echo "::group::$id"
            if ! tools/data-pipeline/scripts/build-address-cell.sh "$id" "$VERSION" "$SOURCE_URL" \
              "https://github.com/${{ github.repository }}/releases/download/$tag" "$CELL_OUT" \
              "$PUBLISHED_INDEX_ARG"; then
              echo "::warning::cella $id fallita, salto e continuo"
              FAILED_CELLS+=("$id")
              echo "::endgroup::"
              continue
            fi
            shopt -s nullglob
            assets=("$CELL_OUT"/cell-*"--${VERSION}--addresses.pmtiles.xz")
            if [ "${#assets[@]}" -gt 0 ]; then
              uploadOk=false
              for attempt in 1 2 3; do
                if gh release upload "$tag" "${assets[@]}" --repo "${{ github.repository }}" --clobber; then
                  uploadOk=true
                  break
                fi
                [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
              done
              if [ "$uploadOk" != true ]; then
                echo "::warning::upload della cella $id fallito, salto e continuo"
                FAILED_CELLS+=("$id")
                echo "::endgroup::"
                continue
              fi
            fi
            [ ! -f "$CELL_OUT/address-grid-entries.jsonl" ] || cat "$CELL_OUT/address-grid-entries.jsonl" >> "$ALL_ENTRIES"
            echo "::endgroup::"
          done < "$SELECTED_FILE"
          if [ "${#FAILED_CELLS[@]}" -gt 0 ]; then
            echo "::warning::celle fallite in questa run (restano con la voce gia' pubblicata, se c'era): ${FAILED_CELLS[*]}"
          fi

          # Attribuzioni per la schermata Licenze: OSM, Overture e i distributori (OpenAddresses,
          # AddressForAll), piu' il testo richiesto da ogni fonte ammessa dalla lista bianca (tutte
          # quelle che la griglia puo' usare nel tempo, non solo quelle toccate dalle celle di oggi -
          # sapere quali finiscono davvero in OGNI cella pubblicata richiederebbe di leggerle tutte a
          # ogni run). {anno} e {data} nei testi: data del rilascio Overture usato. Testi uguali una volta sola.
          ATTRIBUTIONS_TSV="$RUNNER_TEMP/attributions.tsv"
          OVERTURE_DATE="${OVERTURE_RELEASE%%.*}"
          {
            printf 'OpenStreetMap\tODbL-1.0\thttps://www.openstreetmap.org/copyright\n'
            printf 'Overture Maps Foundation (overturemaps.org), OpenAddresses, AddressForAll\tvarie\thttps://docs.overturemaps.org/attribution/\n'
            awk -F'\t' -v anno="${OVERTURE_DATE%%-*}" -v data="$OVERTURE_DATE" \
              '$0 !~ /^#/ && NF >= 5 && $4 == "allow" && !seen[$5]++ {
                 text = $5; gsub(/\{anno\}/, anno, text); gsub(/\{data\}/, data, text)
                 printf "%s\t%s\thttps://docs.overturemaps.org/attribution/\n", text, $3
               }' tools/data-pipeline/overture-address-sources.tsv
          } > "$ATTRIBUTIONS_TSV"

          mkdir -p "$RUNNER_TEMP/fragments" "$RUNNER_TEMP/address-grid-index"
          INDEX_OUT="$RUNNER_TEMP/address-grid-index/address-grid.json"
          FRAGMENT_OUT="$RUNNER_TEMP/fragments/address-grid.json"
          # Stesso schema di ARGS_STR in assemble-site.sh: costruita per pezzi (non con
          # un'espansione di array dentro una stringa gia' tra doppi apici, che non separerebbe
          # correttamente gli elementi).
          ARGS_STR="\"$VERSION\" \"$INDEX_URL\" \"$(winpath "$INDEX_OUT")\" \"$(winpath "$FRAGMENT_OUT")\" \"$(winpath "$ATTRIBUTIONS_TSV")\""
          [ ! -s "$PUBLISHED_INDEX_FILE" ] || ARGS_STR="$ARGS_STR --published \"$(winpath "$PUBLISHED_INDEX_FILE")\""
          [ ! -s "$ALL_ENTRIES" ] || ARGS_STR="$ARGS_STR --entries \"$(winpath "$ALL_ENTRIES")\""
          ./gradlew -q :tools:data-pipeline:content:generateAddressGrid --args="$ARGS_STR"

      # Due artifact distinti e non solo per ordine: il job "publish" scarica "manifest-fragments-*"
      # con merge-multiple (tutti i frammenti appiattiti nella stessa cartella, stesso nome di file
      # accettato perche' ognuno e' un frammento manifest valido) - l'indice vero e proprio non lo
      # e' (niente "manifestVersion", schema diverso) e finirebbe scambiato per un frammento se
      # stesse nello stesso artifact/pattern.
      - name: Carica il frammento manifest dell'indice civici
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-fragments-address-grid
          path: ${{ runner.temp }}/fragments/address-grid.json
          retention-days: 1

      - name: Carica l'indice dei civici
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: address-grid-index
          path: ${{ runner.temp }}/address-grid-index/address-grid.json
          retention-days: 1

  # Genera i pacchetti regionali (poi.db + .rd5) per lo shard assegnato e carica gli asset
  # sulla release "region-data". I frammenti manifest prodotti vanno come artifact al job
  # "publish" sotto (job diversi non condividono il filesystem).
  build:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      GH_TOKEN: ${{ github.token }}
      # Ogni regione torna in rotazione ogni 7 giorni e si rigenera oltre POI_MAX_AGE_DAYS giorni:
      # 6 rinnova i POI a ogni turno (7 li rinnoverebbe ogni due settimane).
      POI_MAX_AGE_DAYS: ${{ github.event.inputs.poi_max_age_days || '6' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # go-pmtiles estrae l'anteprima offline della regione (preview.pmtiles, build-region.sh):
      # versione e sha256 fissati.
      - name: Installa go-pmtiles
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/go-pmtiles.tar.gz" https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          echo "3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  $RUNNER_TEMP/go-pmtiles.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/go-pmtiles.tar.gz" -C "$RUNNER_TEMP/bin" pmtiles
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Genera i pacchetti regionali dello shard
        id: build
        shell: bash
        run: |
          set -euo pipefail
          source tools/data-pipeline/scripts/pilot-regions.sh
          # shellcheck source=./tools/data-pipeline/scripts/lib.sh
          source tools/data-pipeline/scripts/lib.sh

          case "${{ matrix.shard }}" in
            0) SELECTED="${{ needs.plan.outputs.shard0 }}" ;;
            1) SELECTED="${{ needs.plan.outputs.shard1 }}" ;;
            2) SELECTED="${{ needs.plan.outputs.shard2 }}" ;;
          esac
          if [ -z "$SELECTED" ]; then
            echo "-- shard ${{ matrix.shard }} vuoto, nulla da fare"
            echo "has_fragments=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUTPUT_ROOT="$RUNNER_TEMP/regions-out"
          # Pages ospita solo manifest.json + index.html + bandiere (pochi KB, mai vicino al
          # limite di 1GB). poi.db e i .rd5 (il grosso dei dati) vivono invece sugli asset
          # della release "region-data": a differenza di Pages, che sostituisce l'intero sito ad
          # ogni deploy, gli asset di una release non spariscono mai da soli - vedi il commento in
          # testa a assemble-site.sh per il problema che questo risolve (sito cumulativo sopra
          # 1GB con 254 regioni pilota).
          PAGES_BASE_URL="${{ env.PAGES_BASE_URL }}"
          RELEASE_BASE_URL_PREFIX="https://github.com/${{ github.repository }}/releases/download"
          PUBLISHED_MANIFEST_URL="$PAGES_BASE_URL/manifest.json"
          # Data + numero e tentativo della run (YYYY.MM.DD.<run>.<tentativo>): con la sola data una
          # seconda run nello stesso giorno ricaricava con --clobber asset con lo stesso nome (e byte
          # diversi) gia' referenziati dal manifest online. Gli script leggono la data dai nomi degli
          # asset ignorando il suffisso (vedi POI_DATE in build-region.sh).
          VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}.${{ github.run_attempt }}"
          mkdir -p "$OUTPUT_ROOT" "$RUNNER_TEMP/fragments"

          # Manifest pubblicato scaricato una volta per shard e passato come file locale a
          # build-region.sh e build-cities.sh (fetch_published_manifest in lib.sh),
          # invece di due download per regione. Stessa semantica degli script: non scaricabile =
          # errore, 404 = prima pubblicazione (si lascia l'URL, gli script vedono lo stesso 404).
          PUBLISHED_MANIFEST_FILE="$RUNNER_TEMP/published-manifest.json"
          PUBLISHED_MANIFEST_HTTP="$(fetch_published_manifest "$PUBLISHED_MANIFEST_URL" "$PUBLISHED_MANIFEST_FILE")"
          if [ "$PUBLISHED_MANIFEST_HTTP" = "200" ]; then
            PUBLISHED_MANIFEST_URL="$PUBLISHED_MANIFEST_FILE"
          elif [ "$PUBLISHED_MANIFEST_HTTP" != "404" ]; then
            echo "ERRORE: manifest pubblicato non scaricabile da $PUBLISHED_MANIFEST_URL (HTTP ${PUBLISHED_MANIFEST_HTTP:-000})" >&2
            exit 1
          fi

          # Risolta una volta per l'intero shard (non da ogni build-region.sh, vedi lib.sh): stessa
          # build Protomaps per tutte le regioni di questa run, evita fino a 4 richieste HEAD
          # identiche ripetute per ogni singola regione dello shard.
          PROTOMAPS_DATE_OVERRIDE="$(resolve_protomaps_date)"
          export PROTOMAPS_DATE_OVERRIDE
          echo "-- build Protomaps: ${PROTOMAPS_DATE_OVERRIDE}.pmtiles"

          # Una regione che fallisce (es. query Overpass troppo pesante per un bbox enorme) non
          # deve far perdere il lavoro gia' fatto per le regioni precedenti nello stesso shard: con
          # "set -e" un fallimento non protetto da if/else avrebbe interrotto subito lo script,
          # saltando le regioni successive anche se gia' completate con successo (visto: San
          # Marino/Italia/Giappone generati correttamente ma mai pubblicati perche' gli Stati Uniti
          # sono falliti dopo, nella stessa run). L'if/else qui sotto e' una delle eccezioni
          # riconosciute da "set -e" (il comando testato in una condizione if non fa terminare lo
          # script), quindi si continua con le regioni successive.
          FAILED_REGIONS=()
          IFS=',' read -ra SHARD_REGIONS <<< "$SELECTED"

          # Citta' delle regioni (fase 1 di rag-knowledge-plan.md): un solo passaggio sul dump di
          # Wikivoyage IT per l'intero shard (build-cities-dump.sh), prima del giro per regione qui
          # sotto - mai fatale, se fallisce le regioni di questo run restano senza citta' nuove
          # (build-cities.sh, piu' sotto, tiene la voce gia' pubblicata).
          CITIES_REGIONS_TSV="$RUNNER_TEMP/cities-regions.tsv"
          : > "$CITIES_REGIONS_TSV"
          for spec in "${PILOT_REGIONS[@]}"; do
            IFS='|' read -r regionId _displayName _minLon _minLat _maxLon _maxLat wikiTitle _flag _groupName _groupLabel _continent <<< "$spec"
            for r in "${SHARD_REGIONS[@]}"; do
              [ "$r" = "$regionId" ] || continue
              printf '%s\t%s\n' "$regionId" "$wikiTitle" >> "$CITIES_REGIONS_TSV"
              break
            done
          done
          CITIES_JSONL_DIR="$RUNNER_TEMP/cities-jsonl"
          mkdir -p "$CITIES_JSONL_DIR"
          tools/data-pipeline/scripts/build-cities-dump.sh "$CITIES_REGIONS_TSV" "$CITIES_JSONL_DIR" \
            || echo "::warning::dump citta' non generato per questo shard, regioni senza citta' nuove"

          for spec in "${PILOT_REGIONS[@]}"; do
            IFS='|' read -r regionId displayName minLon minLat maxLon maxLat _wikiTitle flag groupName groupLabel continent <<< "$spec"
            match=false
            for r in "${SHARD_REGIONS[@]}"; do [ "$r" = "$regionId" ] && match=true && break; done
            [ "$match" = true ] || continue

            releaseTag="$(region_release_tag "$regionId" "$continent")"
            RELEASE_BASE_URL="$RELEASE_BASE_URL_PREFIX/$releaseTag"
            echo "::group::$regionId"
            regionStart=$SECONDS
            regionOut="$OUTPUT_ROOT/$regionId"
            if tools/data-pipeline/scripts/build-region.sh "$regionId" "$displayName" "$VERSION" \
              "$minLon" "$minLat" "$maxLon" "$maxLat" "$RELEASE_BASE_URL" "$regionOut" \
              "$PUBLISHED_MANIFEST_URL"; then
              # Citta' (facoltative, mai fatali): aggiunge la voce "cities" al frammento e, se il
              # dump e' stato estratto per questa regione (vedi CITIES_JSONL_DIR sopra) e produce
              # sezioni, lascia cities.db.xz da caricare.
              tools/data-pipeline/scripts/build-cities.sh "$regionId" "$VERSION" \
                "$RELEASE_BASE_URL" "$regionOut" "$CITIES_JSONL_DIR" \
                "$PUBLISHED_MANIFEST_URL" || echo "::warning::citta' di $regionId non generate"
              if [ -f "$regionOut/.skipped" ]; then
                # Controllo di necessita' in build-region.sh: tile .rd5 attese invariate rispetto
                # al manifest gia' pubblicato, il frammento e' quello di sempre, niente da
                # ricaricare sulla release (vedi build-region.sh, sezione "2bis").
                echo "-- $regionId invariata: riuso il frammento pubblicato, nessun asset da ricaricare"
              else
                # poi.db.xz, poi-extra.db.xz + segmenti .rd5 (zero o piu' a seconda di quante tile intersecano il
                # bbox) caricati come asset della release, rinominati con un prefisso
                # regionId--version-- per essere univoci nell'intera release (che accumula tutte
                # le regioni). --clobber: un nuovo tentativo di upload qui sotto deve poter
                # sovrascrivere l'asset caricato a meta' dal tentativo fallito (VERSION e' unica per
                # run e tentativo, quindi non tocca mai asset di altre run).
                # In modalita' incrementale (.incremental, vedi build-region.sh sezione 2bis) si
                # caricano solo le tile cambiate, piu' poi.db.xz/poi-extra.db.xz se erano scaduti e sono cambiati,
                # e cities.db.xz se build-cities.sh ne ha prodotto uno nuovo.
                uploads=()
                # I POI, l'anteprima e le citta' si caricano solo compressi (vedi xz_entry
                # in lib.sh, build_preview in build-region.sh).
                for xz in poi.db.xz poi-extra.db.xz preview.pmtiles.xz cities.db.xz; do
                  [ -f "$regionOut/$xz" ] || continue
                  xzAsset="$regionOut/${regionId}--${VERSION}--$xz"
                  cp "$regionOut/$xz" "$xzAsset"
                  uploads+=("$xzAsset")
                done
                for rd5 in "$regionOut"/*.rd5; do
                  [ -e "$rd5" ] || continue
                  rd5Asset="$regionOut/${regionId}--${VERSION}--$(basename "$rd5")"
                  cp "$rd5" "$rd5Asset"
                  uploads+=("$rd5Asset")
                done
                # Fino a 3 tentativi: l'API a volte risponde "release not found" su una release che
                # esiste (tanzania, run del 2026-09-24). --clobber rende sicuro il ricaricamento.
                # Nessun file (es. la regione ha perso solo i POI extra): cambia solo il manifest.
                uploadOk=true
                [ "${#uploads[@]}" -eq 0 ] || uploadOk=false
                for attempt in 1 2 3; do
                  [ "${#uploads[@]}" -gt 0 ] || break
                  if gh release upload "$releaseTag" "${uploads[@]}" --repo "${{ github.repository }}" --clobber; then
                    uploadOk=true
                    break
                  fi
                  if [ "$attempt" -lt 3 ]; then
                    echo "-- upload di $regionId fallito (tentativo $attempt/3), riprovo tra $((attempt * 30))s"
                    sleep $((attempt * 30))
                  fi
                done
                if [ "$uploadOk" != true ]; then
                  echo "::warning::upload asset di $regionId fallito, salto e continuo con le prossime"
                  FAILED_REGIONS+=("$regionId")
                  echo "::endgroup::"
                  continue
                fi
              fi
              # Nome unico per regione: piu' regioni condividerebbero altrimenti lo stesso nome di
              # file "manifest-fragment.json" una volta appiattite nella stessa cartella artifact.
              cp "$regionOut/manifest-fragment.json" "$RUNNER_TEMP/fragments/${regionId}.json"
              # Durata della regione, per bilanciare gli shard delle prossime run (region-timings.tsv).
              # Non quella delle regioni saltate perche' invariate: una settimana dopo non lo saranno.
              if [ ! -f "$regionOut/.skipped" ]; then
                printf '%s\t%d\n' "$regionId" "$((SECONDS - regionStart))" >> "$RUNNER_TEMP/fragments/timings-${{ matrix.shard }}.tsv"
              fi
            else
              echo "::warning::regione $regionId fallita, salto e continuo con le prossime"
              FAILED_REGIONS+=("$regionId")
            fi
            echo "::endgroup::"
          done

          # Riepilogo nella pagina del job, per non dover cercare i problemi nel log.
          {
            echo "### Shard ${{ matrix.shard }}"
            if [ "${#FAILED_REGIONS[@]}" -gt 0 ]; then
              echo "Regioni fallite (non pubblicate, da rilanciare a parte): ${FAILED_REGIONS[*]}"
              echo
            else
              echo "Nessun problema."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          fragmentCount="$(find "$RUNNER_TEMP/fragments" -maxdepth 1 -name '*.json' | wc -l)"
          if [ "$fragmentCount" -eq 0 ]; then
            echo "has_fragments=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna regione completata con successo in questo shard: $SELECTED" >&2
            exit 1
          fi
          if [ "${#FAILED_REGIONS[@]}" -gt 0 ]; then
            echo "::warning::regioni fallite in questo shard (non pubblicate, da rilanciare a parte): ${FAILED_REGIONS[*]}"
          fi
          echo "has_fragments=true" >> "$GITHUB_OUTPUT"

      - name: Carica i frammenti manifest dello shard
        if: steps.build.outputs.has_fragments == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-fragments-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/fragments/*.json
            ${{ runner.temp }}/fragments/*.tsv
          retention-days: 1

  # Riunisce i frammenti manifest di tutti gli shard (e delle guide, e della mappa del mondo) col
  # manifest gia' pubblicato e pubblica su Pages. Gira comunque (!cancelled()) anche se uno shard e'
  # fallito del tutto, cosi' il lavoro degli shard riusciti non va perso — se pero' NESSuno shard ha
  # prodotto frammenti, il passo sotto fallisce esplicitamente (niente da assemblare/pubblicare).
  # Senza il frammento guide il manifest resta con le guide gia' pubblicate; se non ce ne sono
  # (prima run nel formato a pacchetti) la validazione fallisce e non si pubblica nulla. Senza il
  # frammento world-map (nessuna rigenerazione in questa run, il caso comune) resta la mappa del
  # mondo gia' pubblicata, se c'e'.
  publish:
    needs: [guides, world-map, address-grid, build]
    if: ${{ !cancelled() }}
    # Un deploy su Pages (e un merge/pulizia sul manifest) alla volta: vedi il commento sulla concurrency in testa al file.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # contents: write per togliere gli asset non piu' referenziati (ultimo passo).
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # I dati che richiedono un'app piu' recente (min-app-version-code, vedi assemble-site.sh) non
      # si pubblicano prima di quell'app: le installazioni esistenti bloccherebbero i download
      # chiedendo un aggiornamento che non c'e' ancora. versionCode rilasciato = app-status.json
      # (publish-apk.yml), lo stesso che legge il controllo aggiornamenti sul device.
      - name: Controlla che l'app richiesta dai dati sia gia' rilasciata
        shell: bash
        run: |
          set -euo pipefail
          MIN_APP_VERSION_CODE="$(tr -dc '0-9' < tools/data-pipeline/min-app-version-code)"
          RELEASED_VERSION_CODE="$(curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/${{ github.repository }}/releases/download/app-status/app-status.json" \
            | jq -r '.appVersion.versionCode // empty')"
          if ! [[ "$RELEASED_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "versionCode dell'app rilasciata non trovato in app-status.json: non pubblico" >&2
            exit 1
          fi
          if [ "$MIN_APP_VERSION_CODE" -gt "$RELEASED_VERSION_CODE" ]; then
            echo "min-app-version-code ($MIN_APP_VERSION_CODE) e' maggiore del versionCode dell'app rilasciata ($RELEASED_VERSION_CODE): rilasciare prima l'app (publish-apk.yml), poi ripubblicare i dati" >&2
            exit 1
          fi
          echo "-- min-app-version-code $MIN_APP_VERSION_CODE, app rilasciata $RELEASED_VERSION_CODE: ok"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: manifest-fragments-*
          path: ${{ runner.temp }}/fragments
          merge-multiple: true
        continue-on-error: true

      # address-grid.json (l'indice, non un frammento manifest: niente "manifestVersion", non deve
      # entrare nel merge sopra) - facoltativo, assente se il job "address-grid" e' fallito del
      # tutto o non ha prodotto nulla (continue-on-error qui sotto, come per i frammenti).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: address-grid-index
          path: ${{ runner.temp }}/address-grid-index
        continue-on-error: true

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Assembla il sito
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          FRAGMENT_FILES=("$RUNNER_TEMP/fragments"/*.json)
          if [ "${#FRAGMENT_FILES[@]}" -eq 0 ]; then
            echo "Nessuno shard ha prodotto frammenti manifest in questa run, niente da pubblicare" >&2
            exit 1
          fi

          SITE_DIR="$RUNNER_TEMP/site"
          PAGES_BASE_URL="${{ env.PAGES_BASE_URL }}"
          mkdir -p "$SITE_DIR"
          # Manifest pubblicato prima di questa run: lo usano il controllo sulle regioni perse (prima
          # del deploy) e la pulizia degli asset (ultimo passo) per il periodo di grazia di una generazione.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 "$PAGES_BASE_URL/manifest.json" \
            -o "$RUNNER_TEMP/previous-manifest.json" || rm -f "$RUNNER_TEMP/previous-manifest.json"
          # address-grid.json pubblicato prima di questa run: gli URL delle celle non toccate oggi
          # vivono solo li' (non in manifest.json, che ha solo il puntatore "addressGrid"), servono
          # alla pulizia degli asset (ultimo passo) per lo stesso periodo di grazia.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 "$PAGES_BASE_URL/address-grid.json" \
            -o "$RUNNER_TEMP/previous-address-grid.json" || rm -f "$RUNNER_TEMP/previous-address-grid.json"
          # Stesso file anche per il merge (curl legge file://), senza scaricarlo una seconda volta; se
          # il download sopra e' fallito assemble-site.sh riprova dall'URL e decide lui (errore, o
          # BOOTSTRAP=1 alla prima pubblicazione).
          MERGE_MANIFEST_URL="$PAGES_BASE_URL/manifest.json"
          [ ! -s "$RUNNER_TEMP/previous-manifest.json" ] || MERGE_MANIFEST_URL="file://$RUNNER_TEMP/previous-manifest.json"
          tools/data-pipeline/scripts/assemble-site.sh "$SITE_DIR" "$MERGE_MANIFEST_URL" "${FRAGMENT_FILES[@]}"
          # Tempi per regione (peso degli shard nel job "plan"): quelli pubblicati, aggiornati con
          # quelli di questa run. Pages sostituisce l'intero sito, quindi si riportano ogni volta.
          PUBLISHED_TIMINGS="$RUNNER_TEMP/published-timings.tsv"
          curl -sSfL -A "PocketTravelDataPipeline/1.0" "$PAGES_BASE_URL/region-timings.tsv" -o "$PUBLISHED_TIMINGS" || : > "$PUBLISHED_TIMINGS"
          cat "$PUBLISHED_TIMINGS" "$RUNNER_TEMP/fragments"/timings-*.tsv \
            | awk -F'\t' 'NF == 2 && $2 ~ /^[0-9]+$/ { t[$1] = $2 } END { for (r in t) print r "\t" t[r] }' \
            | sort > "$SITE_DIR/region-timings.tsv"

          # address-grid.json (indice dei civici a celle, job "address-grid"): accanto a
          # manifest.json su Pages, come region-timings.tsv sopra - non e' un frammento da
          # unire (e' gia' il risultato finale del merge fatto da generateAddressGrid nel suo
          # job). Se quel job non ha prodotto nulla (download-artifact sopra in continue-on-error),
          # mergeManifests tiene la voce "addressGrid" del manifest pubblicato: si ripubblica
          # allora l'indice precedente, lo stesso file (e sha256) a cui quella voce punta, invece
          # di lasciare il puntatore verso un file sparito dal sito.
          ADDRESS_GRID_FILE="$RUNNER_TEMP/address-grid-index/address-grid.json"
          if [ -s "$ADDRESS_GRID_FILE" ]; then
            cp "$ADDRESS_GRID_FILE" "$SITE_DIR/address-grid.json"
          elif [ -s "$RUNNER_TEMP/previous-address-grid.json" ]; then
            cp "$RUNNER_TEMP/previous-address-grid.json" "$SITE_DIR/address-grid.json"
          fi

          echo "site_dir=$SITE_DIR" >> "$GITHUB_OUTPUT"
          echo "pages_host=${{ github.repository_owner }}.github.io" >> "$GITHUB_OUTPUT"

      - name: Valida il manifest prima del deploy
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="${{ steps.assemble.outputs.site_dir }}"
          ARGS="$SITE_DIR/manifest.json ${{ steps.assemble.outputs.pages_host }}"
          [ ! -s "$SITE_DIR/address-grid.json" ] || ARGS="$ARGS $SITE_DIR/address-grid.json"
          ./gradlew -q :tools:data-pipeline:content:validateManifest --args="$ARGS"

      # Prima del deploy: ogni regione del manifest precedente deve restare nel nuovo, salvo quelle
      # che il merge toglie di proposito (fuori da pilot-regions.sh, o sostituite da un gruppo ormai
      # completo e quindi in "replacedRegions", vedi knownRegionIds/replacedRegions in
      # MergeManifests.kt). Altrimenti e' quasi certamente un merge incompleto: pubblicarlo farebbe
      # sparire regioni dall'app e la pulizia ne cancellerebbe gli asset.
      - name: Controlla che il nuovo manifest non perda regioni
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="${{ steps.assemble.outputs.site_dir }}/manifest.json"
          PREVIOUS_MANIFEST="$RUNNER_TEMP/previous-manifest.json"
          if [ ! -s "$PREVIOUS_MANIFEST" ]; then
            echo "::warning::manifest precedente non disponibile: nessun confronto sulle regioni"
            exit 0
          fi
          source tools/data-pipeline/scripts/pilot-regions.sh
          KNOWN="$RUNNER_TEMP/known-regions.txt"
          for spec in "${PILOT_REGIONS[@]}" "${REPLACED_REGIONS[@]}"; do echo "${spec%%|*}"; done | sort -u > "$KNOWN"
          MISSING="$(jq -r --rawfile known "$KNOWN" --slurpfile new "$MANIFEST" '
            ($known | split("\n") | map(select(length > 0))) as $k
            | ([$new[0].regions[].regionId] + [($new[0].replacedRegions // [])[].regionId]) as $kept
            | [(.regions // [])[].regionId | select(IN($k[]) and (IN($kept[]) | not))] | join(" ")
          ' "$PREVIOUS_MANIFEST")"
          if [ -n "$MISSING" ]; then
            echo "Il nuovo manifest ha perso regioni ancora nel lotto pilota: $MISSING. Non pubblico" >&2
            exit 1
          fi
          echo "-- nessuna regione persa ($(jq '.regions | length' "$PREVIOUS_MANIFEST") prima, $(jq '.regions | length' "$MANIFEST") ora)"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Un nome per tentativo: ogni rilancio di una run carica un altro artefatto nella stessa
      # run, e deploy-pages rifiuta di pubblicare se ne trova piu' d'uno con lo stesso nome
      # ("Multiple artifacts named github-pages", run del 2026-09-21 al terzo tentativo).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ steps.assemble.outputs.site_dir }}

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # Gli asset si chiamano regionId--VERSION--file: ogni rigenerazione ne aggiunge di nuovi
      # senza togliere i vecchi, e ogni release e' limitata a 1000 asset. Dopo il deploy (i vecchi
      # URL restano in uso fino ad allora) si cancella da ogni release "region-data*" e da
      # "world-map" cio' che il manifest appena pubblicato non referenzia piu'. Il manifest e'
      # cumulativo (frammenti di questa run + regioni/mappa del mondo gia' pubblicate), quindi le
      # regioni non toccate restano intatte. Periodo di grazia di una generazione: resta anche cio'
      # che referenziava il manifest precedente (le app che l'hanno appena letto scaricano ancora
      # quegli URL).
      - name: Rimuove gli asset non piu' referenziati dal manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANIFEST="${{ steps.assemble.outputs.site_dir }}/manifest.json"
          PREVIOUS_MANIFEST="$RUNNER_TEMP/previous-manifest.json"
          if [ ! -s "$PREVIOUS_MANIFEST" ]; then
            echo "::warning::manifest precedente non disponibile: non cancello nulla in questa run"
            exit 0
          fi
          # Le regioni perse per un merge incompleto le ferma gia' il controllo prima del deploy.
          # Gli URL delle celle dei civici vivono in address-grid.json, non in manifest.json (che ha
          # solo il puntatore "addressGrid"): senza questi due file la pulizia cancellerebbe subito
          # gli asset di ogni cella non toccata dalla run di oggi (quasi tutte, vedi la quota
          # giornaliera nel job "address-grid").
          REFERENCED="$RUNNER_TEMP/referenced.txt"
          SCAN_FILES=("$MANIFEST" "$PREVIOUS_MANIFEST")
          for f in "${{ steps.assemble.outputs.site_dir }}/address-grid.json" "$RUNNER_TEMP/previous-address-grid.json"; do
            if [ -s "$f" ]; then SCAN_FILES+=("$f"); fi
          done
          cat "${SCAN_FILES[@]}" \
            | grep -oE 'https://github\.com/[^"]+/releases/download/[^"/]+/[^"]+' \
            | sed -E 's#.*/releases/download/##' | sort -u > "$REFERENCED"
          if [ ! -s "$REFERENCED" ]; then
            echo "Il manifest non referenzia alcun asset di release: non cancello nulla" >&2
            exit 1
          fi
          # Gli asset caricati nelle ultime 24 ore restano anche se non referenziati: possono essere di
          # un'altra run ancora in corso (vedi il commento sulla concurrency in testa al file), la
          # pulizia della run successiva li togliera'.
          CUTOFF="$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)"
          for tag in $(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName' | grep -E '^(region-data|world-map|address-cells-)'); do
            deleted=0
            total=0
            # Elenco completo a pagine di 100 (quello dentro la release puo' essere troncato).
            releaseId="$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.id')"
            while IFS=$'\t' read -r name createdAt; do
              [ -n "$name" ] || continue
              total=$((total + 1))
              if ! grep -qxF "$tag/$name" "$REFERENCED" && [[ "$createdAt" < "$CUTOFF" ]]; then
                gh release delete-asset "$tag" "$name" --repo "${{ github.repository }}" --yes
                deleted=$((deleted + 1))
              fi
            done < <(gh api --paginate "repos/${{ github.repository }}/releases/$releaseId/assets?per_page=100" --jq '.[] | [.name, .created_at] | @tsv')
            kept=$((total - deleted))
            echo "-- $tag: $deleted asset non referenziati rimossi, $kept restano"
            # Durante una rigenerazione completa i nuovi asset si sommano ai vecchi: sopra i 500
            # stabili una release rischia di superare il limite di 1000 (vedi region_release_tag).
            if [ "$kept" -gt 500 ]; then
              echo "::warning::$tag ha $kept asset: rischia il limite di 1000 durante una rigenerazione completa, valuta di dividerla (region_release_tag in pilot-regions.sh)"
            fi
          done
