name: Publish APK

# Compila un APK di release (mai debug, e mai come artifact di workflow) firmato con
# la upload key e lo pubblica come asset di una GitHub Release, taggata con
# versionName da app/build.gradle.kts.
# Su push a main parte solo se il push tocca app/build.gradle.kts e versionCode e' cambiato
# rispetto al commit precedente (vedi job check-version-bump) - un push senza bump di
# versione non deve ripubblicare la stessa release. workflow_dispatch resta un modo per ripubblicare sullo stesso commit
# (es. per rigenerare un asset corrotto) senza dover fare un bump finto; da un commit
# diverso da quello del tag il job si ferma e serve un bump di versione.
#
# Pubblica anche app-status.json (versione corrente dell'app e del modello IA sul dispositivo) sulla release
# fissa "app-status": il controllo aggiornamenti sul dispositivo (core:sync/AppUpdateCheckWorker,
# feature:ai/LlmModelUpdateCheckWorker) lo legge da li', volutamente separato da manifest.json
# (pacchetti regionali, publish-regions.yml) — versione app/modello cambiano solo con un
# rilascio, mai insieme all'aggiornamento dati regionali.
# Nome della run con l'identificativo di upload_hf.py --update-app-status, che cosi' segue la propria run e
# non un altro lancio manuale; vuoto negli altri casi, e GitHub usa il nome predefinito.
run-name: ${{ inputs.request_id != '' && format('Impronte dei modelli {0}', inputs.request_id) || '' }}
on:
  push:
    branches: [main]
    # versionCode e versionName stanno solo in app/build.gradle.kts: un push che non lo tocca non puo' contenere un bump.
    paths: [app/build.gradle.kts]
  workflow_dispatch:
    inputs:
      resign_app_status:
        description: "Solo app-status.json: lo ricostruisce dal tag della versione rilasciata e lo firma, senza APK"
        type: boolean
        default: false
      update_models:
        description: 'Solo impronte dei modelli in app-status.json (da upload_hf.py --update-app-status): JSON [{"modelId","sha256","sizeBytes"}]'
        type: string
        default: ""
      request_id:
        description: "Identificativo del lancio, nel nome della run (lo imposta upload_hf.py)"
        type: string
        default: ""

# Minimo a livello di workflow: contents: write solo al job che pubblica le release.
permissions:
  contents: read

# git legge la configurazione anche dall'ambiente: niente suggerimento "Using 'master' as the name for the initial
# branch" in ogni checkout.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  check-version-bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: check
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Confronto con il commit prima del push (non HEAD~1): un push di piu' commit con il bump
          # in uno intermedio va comunque pubblicato. HEAD~1 solo se manca (primo push del ramo,
          # SHA tutto zeri) o non e' piu' raggiungibile (force push).
          # retry: un errore di rete non deve far ripiegare su HEAD~1.
          source .github/scripts/retry.sh
          BASE="${BEFORE_SHA:-}"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! retry -n 2 git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          CURRENT="$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)"
          PREVIOUS="$(git show "$BASE:app/build.gradle.kts" 2>/dev/null | grep -oP 'versionCode = \K[0-9]+' || echo 0)"
          # Solo un aumento e' un bump: un revert che abbassa versionCode non deve pubblicare.
          if [ "$CURRENT" -gt "$PREVIOUS" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: check-version-bump
    # Solo da main: un workflow_dispatch lanciato da un altro ramo non deve pubblicare release ne'
    # app-status.json.
    if: needs.check-version-bump.outputs.bumped == 'true' && github.ref == 'refs/heads/main' && !inputs.resign_app_status && !inputs.update_models
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    # Gruppo proprio, separato da quello di app-status.json (publish-apk-status): GitHub tiene al massimo un
    # job in attesa per gruppo e annulla quello gia' in attesa quando ne arriva un altro, quindi un dispatch
    # di app-status.json non deve poter annullare un bump in attesa. Qui e non a livello di workflow: un push
    # senza bump (che salta questo job) non deve annullare la run in attesa di un bump. L'ordine tra due
    # bump lo garantisce il controllo "Versione non inferiore a quella pubblicata", ripetuto dal job
    # publish-app-status subito prima di caricare app-status.json: due rilasci in gruppi diversi possono
    # finire in ordine inverso. Limite che resta: due bump ravvicinati con un terzo gia' in corso fanno
    # annullare il primo in attesa, e va rilanciato a mano.
    concurrency:
      group: publish-apk-release
      cancel-in-progress: false
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 400M
    steps:
      # Niente credenziali git nel checkout: il job non fa operazioni git autenticate e il token di
      # scrittura non deve restare leggibile dal codice di build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # Cache di Gradle in sola lettura: la scrive solo il job "build" di android-ci.yml, che compila anche la
      # pipeline. Un salvataggio per job riempirebbe il limite di 10 GB delle cache del repository e farebbe
      # sfrattare le altre (dump, traduzioni, ccache).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Heap del daemon a 3 GB solo in CI (gradle.properties ha 2 GB), come nel job "build" di android-ci.yml: il
      # gradle.properties della cartella utente prevale su quello del progetto; gli altri argomenti restano quelli del progetto.
      - name: Memoria di Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=$(sed -n 's/^org.gradle.jvmargs=//p' gradle.properties | sed 's/-Xmx[0-9]*[mMgG]/-Xmx3g/')" >> "$HOME/.gradle/gradle.properties"

      # Oggetti di llama.cpp gia' compilati dal job "build" di android-ci.yml (stessa chiave, stessa versione dell'NDK),
      # in sola lettura: senza, llama.cpp si compila da zero (~3,5 minuti). Gli oggetti sono quelli che darebbe la
      # compilazione da zero; la cache la scrive solo android-ci su main.
      - name: ccache per llama.cpp
        uses: ./.github/actions/setup-ccache-llama

      # Prima di compilare: una release con impronte dei modelli diverse dai file su Hugging Face
      # rifiuterebbe i download, quindi il job si ferma qui.
      - name: Impronte dei modelli IA per app-status.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/resolve-ai-models.sh \
            feature/ai/src/main/kotlin/com/pockettravel/feature/ai/LlmModelCatalog.kt "$RUNNER_TEMP/ai-models.json"

      # Mai indietro: una versione piu' bassa di quella pubblicata (revert del bump, run vecchia) farebbe
      # tornare "Latest" la release precedente e app-status.json a un versionCode piu' vecchio.
      # Letto senza verificare la firma: un file manomesso puo' solo bloccare la pubblicazione, non
      # farla passare per quello che non e'. Uguale e' ammesso: rilancio sullo stesso commit.
      - name: Versione non inferiore a quella pubblicata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          VERSION_CODE="$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)"
          PUBLISHED="$(retry gh release download app-status -p app-status.json -O - --repo "$GITHUB_REPOSITORY" | jq -r '.appVersion.versionCode // 0')"
          if [ "$VERSION_CODE" -lt "$PUBLISHED" ]; then
            echo "::error::versionCode $VERSION_CODE e' minore di quello pubblicato ($PUBLISHED): serve un bump di versione" >&2
            exit 1
          fi

      # Lint e test unitari prima di firmare e pubblicare: un bump di versione su un commit con i test
      # rossi non deve produrre una release. Qui e non come attesa di android-ci sullo stesso SHA, che
      # richiederebbe di interrogare le API (e di gestire attese, run annullate e rilanci manuali).
      # Senza i segreti di firma: li vedrebbero anche le JVM di test e di lint.
      - name: Lint e test unitari
        shell: bash
        run: ./gradlew lint testDebugUnitTest --no-daemon

      - name: Decodifica il keystore di firma
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK di release firmato
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon

      - name: Elimina il keystore decodificato
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Pubblica la release su GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          TAG="v$VERSION"
          APK="app/build/outputs/apk/release/app-release.apk"
          CHANGELOG_URL="https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          # Estrae solo la sezione di questa versione da CHANGELOG.md (dal suo "## [VERSION]",
          # con o senza " - <data>", alla prossima intestazione "## [", esclusa), cosi' le note
          # della release non duplicano a mano un testo che va tenuto sincronizzato in un solo posto.
          SECTION="$(awk -v ver="## [$VERSION]" '
            $0 == ver || index($0, ver " - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          # Sezione assente o vuota: una release senza note si scopre solo dopo, meglio fermarsi.
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            echo "Nessuna voce \"## [$VERSION]\" (o voce vuota) in CHANGELOG.md: aggiungerla prima di pubblicare" >&2
            exit 1
          fi
          {
            echo "Changelog completo: $CHANGELOG_URL"
            echo ""
            printf '%s\n' "$SECTION"
          } > "$NOTES_FILE"

          # Un rilancio sullo stesso commit (es. per un asset corrotto) riusa la release gia' creata
          # invece di fallire su "release already exists". Da un commit diverso no: l'APK sostituito
          # non corrisponderebbe al tag, da cui leggono resign-app-status e update-app-status-models,
          # e chi ha gia' quel versionCode non verrebbe avvisato: serve un bump di versione.
          # --latest esplicito in tutti e due i rami: il badge "Latest" va solo all'ultima versione
          # dell'app, anche se nel frattempo e' stata creata una release di dati (ensure_release le
          # crea con --latest=false, ma quelle create prima di quella modifica lo avevano preso).
          # Nel ramo di creazione l'APK e' un argomento di "gh release create", che crea la release in
          # bozza, carica i file e solo allora la pubblica: un upload fallito non lascia una release
          # pubblica e "Latest" senza APK.
          publish_release() {
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              # Il tag puo' mancare (release senza tag): allora si prosegue. L'API dereferenzia anche i tag annotati.
              # Un errore diverso da 404 e' passeggero: esce dalla funzione e retry riprova.
              TAG_SHA=""
              if ! TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha 2>"$RUNNER_TEMP/tag-sha.err")"; then
                TAG_SHA=""
                grep -qiE 'not found|HTTP 404|No commit found' "$RUNNER_TEMP/tag-sha.err" || { cat "$RUNNER_TEMP/tag-sha.err" >&2; return 1; }
              fi
              if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "::error::$TAG punta a $TAG_SHA, non a $GITHUB_SHA: per un APK diverso serve un bump di versione" >&2
                exit 1
              fi
              # && e non due righe: dentro retry set -e non vale, un edit fallito non deve proseguire.
              # --draft=false: una creazione interrotta dopo la bozza lascia qui una release ancora da pubblicare.
              gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file "$NOTES_FILE" --latest --draft=false &&
                gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber
            else
              gh release create "$TAG" "$APK" --repo "${{ github.repository }}" \
                --target "$GITHUB_SHA" \
                --title "Pocket Travel $VERSION" \
                --notes-file "$NOTES_FILE" \
                --latest
            fi
          }
          retry publish_release

      # Le impronte calcolate prima della compilazione vanno al job publish-app-status, che compone e firma
      # app-status.json senza eseguire codice di build.
      - name: Passa le impronte dei modelli IA al job che firma app-status.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-models
          path: ${{ runner.temp }}/ai-models.json
          if-no-files-found: error
          retention-days: 1

  # Compone, firma e carica app-status.json di un rilascio. Senza Gradle ne' codice di build: e' il job del
  # rilascio che vede MANIFEST_SIGNING_KEY, la chiave che fa accettare i dati a tutte le app installate.
  # Gruppo proprio, condiviso con resign-app-status e update-app-status-models, gli altri che scrivono
  # app-status.json: due scritture non si sovrappongono. Limite che resta: GitHub tiene al massimo un job in
  # attesa per gruppo e annulla quello gia' in attesa quando ne arriva un altro, quindi un dispatch di
  # app-status.json in attesa puo' essere annullato da un altro dispatch (non piu' da un bump, che e' in
  # un altro gruppo).
  publish-app-status:
    needs: build-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-apk-status
      cancel-in-progress: false
    steps:
      # Serve il checkout di questo commit per versionName e versionCode e per SyncConfig.kt, da cui
      # sign-files.sh legge la chiave pubblica ufficiale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-models
          path: ${{ runner.temp }}/ai-models

      # Senza la chiave: il file di impronte arriva da un altro job e si controlla prima di firmarlo.
      - name: Componi app-status.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          VERSION_CODE="$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)"
          APP_STATUS_FILE="$RUNNER_TEMP/app-status.json"
          AI_MODELS_FILE="$RUNNER_TEMP/ai-models/ai-models.json"

          jq -e 'type == "array" and all(.[];
              (.modelId | type == "string" and test("^[A-Za-z0-9._-]+$"))
              and (.sha256 | type == "string" and test("^[0-9a-f]{64}$"))
              and (.sizeBytes | type == "number" and . > 0 and floor == .))' "$AI_MODELS_FILE" > /dev/null \
            || { echo "::error::ai-models.json non valido" >&2; exit 1; }

          # publishedAt (secondi Unix) prima della firma: l'app rifiuta un valore piu' basso dell'ultimo
          # accettato (niente ritorno a una vecchia coppia file + .sig che nasconda l'aggiornamento).
          jq -n \
            --arg versionName "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --slurpfile aiModels "$AI_MODELS_FILE" \
            --argjson publishedAt "$(date +%s)" \
            '{publishedAt: $publishedAt, appVersion: {versionName: $versionName, versionCode: $versionCode}, aiModels: $aiModels[0]}' \
            > "$APP_STATUS_FILE"

      - name: Firma e pubblica app-status.json (controllo aggiornamenti app/modelli IA sul dispositivo)
        shell: bash
        # Firma ECDSA del file (app-status.json.sig, stessa chiave di manifest.json in
        # publish-regions.yml): senza il secret il passo fallisce, vedi .github/scripts/sign-files.sh.
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          APP_STATUS_FILE="$RUNNER_TEMP/app-status.json"
          # Release fissa "app-status" (stesso pattern di "region-data" in publish-regions.yml),
          # non GitHub Pages: appVersion/aiModels devono cambiare solo con un rilascio app, mai
          # insieme all'aggiornamento (settimanale/manuale) del catalogo su Pages -
          # vedi SyncConfig.APP_STATUS_URL (core:sync).
          ensure_release app-status \
            "Stato app" \
            "app-status.json: versione corrente dell'app e dei modelli IA sul dispositivo, letti da core:sync/AppUpdateCheckWorker e feature:ai/LlmModelUpdateCheckWorker. Non e' una release software."

          bash .github/scripts/sign-and-upload-app-status.sh "$APP_STATUS_FILE"

  # Ripubblica app-status.json ricostruito dai sorgenti del tag della versione rilasciata (v<versionName>
  # di main), con publishedAt nuovo e firmato: per un file caricato prima che si firmasse, che le build
  # recenti rifiutano. Mai firmare il file online cosi' com'e': un asset manomesso diventerebbe firmato.
  # Il catalogo dei modelli e' quello del tag, non di main; le impronte sono quelle che coincidono con i file su
  # Hugging Face (resolve-ai-models.sh), cosi' quelle pubblicate da update-app-status-models non vanno perse.
  resign-app-status:
    if: github.event_name == 'workflow_dispatch' && inputs.resign_app_status && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-apk-status
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Senza la chiave: legge i sorgenti del tag e le impronte (resolve-ai-models.sh: app-status.json pubblicato con gh,
      # poi Hugging Face).
      - name: Ricostruisci app-status.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::$TAG non esiste ancora: rilascio in corso o fallito" >&2; exit 1; }
          git show "$TAG:app/build.gradle.kts" > "$RUNNER_TEMP/build.gradle.kts"
          git show "$TAG:feature/ai/src/main/kotlin/com/pockettravel/feature/ai/LlmModelCatalog.kt" > "$RUNNER_TEMP/LlmModelCatalog.kt"
          VERSION="$(grep -oP 'versionName = "\K[^"]+' "$RUNNER_TEMP/build.gradle.kts")"
          VERSION_CODE="$(grep -oP 'versionCode = \K[0-9]+' "$RUNNER_TEMP/build.gradle.kts")"
          APP_STATUS_FILE="$RUNNER_TEMP/app-status.json"
          AI_MODELS_FILE="$RUNNER_TEMP/ai-models.json"
          bash .github/scripts/resolve-ai-models.sh "$RUNNER_TEMP/LlmModelCatalog.kt" "$AI_MODELS_FILE"
          jq -n \
            --arg versionName "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --slurpfile aiModels "$AI_MODELS_FILE" \
            --argjson publishedAt "$(date +%s)" \
            '{publishedAt: $publishedAt, appVersion: {versionName: $versionName, versionCode: $versionCode}, aiModels: $aiModels[0]}' \
            > "$APP_STATUS_FILE"

      - name: Firma e ripubblica app-status.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: bash .github/scripts/sign-and-upload-app-status.sh "$RUNNER_TEMP/app-status.json"

  # Aggiorna in app-status.json le impronte (sha256, dimensione) dei modelli appena ricaricati su Hugging Face
  # con lo stesso nome file, senza rilasciare l'app: le build che leggono le impronte da qui (dalla 0.9.1)
  # verificano il download con queste. Lanciato da upload_hf.py --update-app-status. Parte dal file online
  # solo dopo averne verificato la firma (mai firmare un asset manomesso) e accetta un'impronta solo se
  # coincide con quella che Hugging Face riporta per il file del catalogo dei modelli.
  update-app-status-models:
    if: github.event_name == 'workflow_dispatch' && inputs.update_models != '' && !inputs.resign_app_status && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-apk-status
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Senza la chiave: l'input del dispatch, il file online e le risposte di Hugging Face si controllano qui.
      - name: Aggiorna app-status.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Dall'ambiente e non interpolato nello script: il testo dell'input non diventa codice.
          UPDATE_MODELS: ${{ inputs.update_models }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          CATALOG="feature/ai/src/main/kotlin/com/pockettravel/feature/ai/LlmModelCatalog.kt"
          ONLINE="$RUNNER_TEMP/online.json"
          UPDATES="$RUNNER_TEMP/updates.json"
          APP_STATUS_FILE="$RUNNER_TEMP/app-status.json"

          printf '%s' "$UPDATE_MODELS" > "$UPDATES"
          jq -e 'type == "array" and length > 0 and all(.[];
              (keys == ["modelId", "sha256", "sizeBytes"])
              and (.modelId | type == "string" and test("^[A-Za-z0-9._-]+$"))
              and (.sha256 | type == "string" and test("^[0-9a-f]{64}$"))
              and (.sizeBytes | type == "number" and . > 0 and floor == .))' "$UPDATES" > /dev/null \
            || { echo "::error::update_models non valido" >&2; exit 1; }

          retry gh release download app-status --pattern 'app-status.json*' --dir "$RUNNER_TEMP/online" \
            --repo "${{ github.repository }}" --clobber
          bash .github/scripts/verify-app-status.sh "$RUNNER_TEMP/online/app-status.json"
          mv "$RUNNER_TEMP/online/app-status.json" "$ONLINE"

          # URL dal catalogo dei modelli del tag rilasciato, cercato per id: e' quello da cui scaricano le app in circolazione.
          TAG="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::$TAG non esiste ancora: rilascio in corso o fallito" >&2; exit 1; }
          git show "$TAG:$CATALOG" > "$RUNNER_TEMP/LlmModelCatalog.kt"

          mapfile -t ROWS < <(jq -c '.[]' "$UPDATES")
          for row in "${ROWS[@]}"; do
            ID="$(jq -r '.modelId' <<< "$row")"
            SHA="$(jq -r '.sha256' <<< "$row")"
            SIZE="$(jq -r '.sizeBytes' <<< "$row")"
            FILE="$(jq -r --arg id "$ID" '.aiModels[] | select(.modelId == $id) | .modelVersion' "$ONLINE")"
            [ -n "$FILE" ] || { echo "::error::$ID non e' in app-status.json" >&2; exit 1; }
            URL="$(awk -v id="id = \"$ID\"" '
              index($0, id) { found = 1 }
              found && match($0, /url = "[^"]+"/) { print substr($0, RSTART + 7, RLENGTH - 8); exit }
              /^ *\),/ { found = 0 }' "$RUNNER_TEMP/LlmModelCatalog.kt")"
            [ "${URL##*/}" = "$FILE" ] || { echo "::error::nel catalogo dei modelli di $TAG $ID non scarica $FILE ($URL)" >&2; exit 1; }
            # Senza seguire il redirect: X-Linked-ETag e X-Linked-Size sono lo sha256 e la dimensione del file LFS.
            HEADERS="$(retry curl -sSfI "$URL" | tr -d '\r')"
            REMOTE_SHA="$(grep -i '^x-linked-etag:' <<< "$HEADERS" | grep -oE '[0-9a-f]{64}' || true)"
            REMOTE_SIZE="$(grep -i '^x-linked-size:' <<< "$HEADERS" | grep -oE '[0-9]+' || true)"
            if [ "$REMOTE_SHA" != "$SHA" ] || [ "$REMOTE_SIZE" != "$SIZE" ]; then
              echo "::error::$FILE su Hugging Face ha sha256 $REMOTE_SHA e $REMOTE_SIZE byte, non quelli richiesti" >&2
              exit 1
            fi
            echo "-- $ID ($FILE): $SHA, $SIZE byte"
          done

          jq --slurpfile updates "$UPDATES" --argjson publishedAt "$(date +%s)" '
            .publishedAt = $publishedAt
            | .aiModels |= map(. as $m
                | (first($updates[0][] | select(.modelId == $m.modelId)) // null) as $u
                | if $u == null then . else .sha256 = $u.sha256 | .sizeBytes = $u.sizeBytes end)' \
            "$ONLINE" > "$APP_STATUS_FILE"

      - name: Firma e ripubblica app-status.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: bash .github/scripts/sign-and-upload-app-status.sh "$RUNNER_TEMP/app-status.json"
