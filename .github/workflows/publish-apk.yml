name: Publish APK

# Compila un APK di release (mai debug, e mai come artifact di workflow) firmato con
# la upload key e lo pubblica come asset di una GitHub Release, taggata con
# versionName da app/build.gradle.kts.
# Su push a main parte solo se versionCode e' cambiato rispetto al commit precedente
# (vedi job check-version-bump) - un push senza bump di versione non deve ripubblicare
# la stessa release. workflow_dispatch resta un modo per forzare comunque una
# ripubblicazione (es. per rigenerare un asset corrotto) senza dover fare un bump finto.
#
# Pubblica anche app-status.json (versione app + modello IA on-device correnti) sulla release
# fissa "app-status": il controllo aggiornamenti sul device (core:sync/AppUpdateCheckWorker,
# feature:ai/LlmModelUpdateCheckWorker) lo legge da li', volutamente separato da manifest.json
# (pacchetti regionali, publish-regions.yml) — versione app/modello cambiano solo con un
# rilascio, mai insieme all'aggiornamento dati regionali.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resign_app_status:
        description: "Solo app-status.json: lo ricostruisce dal tag della versione rilasciata e lo firma, senza APK"
        type: boolean
        default: false

# Minimo a livello di workflow: contents: write solo al job che pubblica le release.
permissions:
  contents: read

jobs:
  check-version-bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - id: check
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Confronto con il commit prima del push (non HEAD~1): un push di piu' commit con il bump
          # in uno intermedio va comunque pubblicato. HEAD~1 solo se manca (primo push del ramo,
          # SHA tutto zeri) o non e' piu' raggiungibile (force push).
          # retry: un errore di rete non deve far ripiegare su HEAD~1.
          source .github/scripts/retry.sh
          BASE="${BEFORE_SHA:-}"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! retry -n 2 git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          CURRENT="$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)"
          PREVIOUS="$(git show "$BASE:app/build.gradle.kts" 2>/dev/null | grep -oP 'versionCode = \K[0-9]+' || echo 0)"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: check-version-bump
    # Solo da main: un workflow_dispatch lanciato da un altro ramo non deve pubblicare release ne'
    # app-status.json.
    if: needs.check-version-bump.outputs.bumped == 'true' && github.ref == 'refs/heads/main' && !inputs.resign_app_status
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    # Due bump ravvicinati uno dopo l'altro: senza, il job piu' vecchio potrebbe finire per ultimo e
    # riportare app-status.json a un versionCode precedente. Qui e non a livello di workflow: un push
    # senza bump (che salta questo job) non deve annullare la run in attesa di un bump.
    concurrency:
      group: publish-apk
      cancel-in-progress: false
    steps:
      # Niente credenziali git nel checkout: il job non fa operazioni git autenticate e il token di
      # scrittura non deve restare leggibile dal codice di build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decodifica il keystore di firma
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Lint e test unitari prima di firmare e pubblicare: un bump di versione su un commit con i test
      # rossi non deve produrre una release. Qui e non come attesa di android-ci sullo stesso SHA, che
      # richiederebbe di interrogare le API (e di gestire attese, run annullate e rilanci manuali).
      # Una sola invocazione Gradle: un solo avvio e una sola configurazione dei progetti.
      - name: Lint, test unitari e build APK di release firmato
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew lint testDebugUnitTest assembleRelease --no-daemon

      - name: Pubblica la release su GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          TAG="v$VERSION"
          APK="app/build/outputs/apk/release/app-release.apk"
          CHANGELOG_URL="https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          # Estrae solo la sezione di questa versione da CHANGELOG.md (dal suo "## [VERSION]"
          # alla prossima intestazione "## [", esclusa), cosi' le note della release non
          # duplicano a mano un testo che va tenuto sincronizzato in un solo posto.
          SECTION="$(awk -v ver="## [$VERSION]" '
            $0 == ver { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          # Sezione assente o vuota: una release senza note si scopre solo dopo, meglio fermarsi.
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            echo "Nessuna voce \"## [$VERSION]\" (o voce vuota) in CHANGELOG.md: aggiungerla prima di pubblicare" >&2
            exit 1
          fi
          {
            echo "Changelog completo: $CHANGELOG_URL"
            echo ""
            printf '%s\n' "$SECTION"
          } > "$NOTES_FILE"

          # Un rilancio dello stesso workflow sulla stessa VERSION (es. per correggere un
          # problema nell'APK appena caricato) deve poter riusare la release gia' creata
          # invece di fallire su "release already exists".
          publish_release() {
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" --repo "${{ github.repository }}" \
                --target "$GITHUB_SHA" \
                --title "Pocket Travel $VERSION" \
                --notes-file "$NOTES_FILE"
            fi
          }
          retry publish_release
          retry gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber

      - name: Pubblica app-status.json (controllo aggiornamenti app/modelli IA sul device)
        shell: bash
        # Firma ECDSA del file (app-status.json.sig, stessa chiave di manifest.json in
        # publish-regions.yml): senza il secret il passo fallisce, vedi .github/scripts/sign-files.sh.
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          # Release fissa "app-status" (stesso pattern di "region-data" in publish-regions.yml),
          # non GitHub Pages: appVersion/aiModels devono cambiare solo con un rilascio app, mai
          # insieme all'aggiornamento (settimanale/manuale) dei pacchetti regionali su Pages -
          # vedi SyncConfig.APP_STATUS_URL (core:sync).
          ensure_release app-status \
            "Stato app" \
            "app-status.json: versione app e modelli IA on-device correnti, letti da core:sync/AppUpdateCheckWorker e feature:ai/LlmModelUpdateCheckWorker. Non e' una release software."

          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          VERSION_CODE="$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)"

          APP_STATUS_FILE="$RUNNER_TEMP/app-status.json"
          AI_MODELS_FILE="$RUNNER_TEMP/ai-models.json"

          # LlmModelCatalog e' una lista di LlmModelDefinition (una entry per modello): jq/grep non
          # bastano, serve un parser vero - vedi
          # scripts/generate_ai_models_manifest.py per il perche' non e' inline qui (heredoc
          # bash e indentazione block scalar YAML sono incompatibili in questo caso).
          python3 scripts/generate_ai_models_manifest.py \
            "feature/ai/src/main/kotlin/com/pockettravel/feature/ai/LlmModelCatalog.kt" \
            > "$AI_MODELS_FILE"

          # publishedAt (secondi Unix) prima della firma: l'app rifiuta un valore piu' basso dell'ultimo
          # accettato (niente ritorno a una vecchia coppia file + .sig che nasconda l'aggiornamento).
          jq -n \
            --arg versionName "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --slurpfile aiModels "$AI_MODELS_FILE" \
            --argjson publishedAt "$(date +%s)" \
            '{publishedAt: $publishedAt, appVersion: {versionName: $versionName, versionCode: $versionCode}, aiModels: $aiModels[0]}' \
            > "$APP_STATUS_FILE"

          bash .github/scripts/sign-files.sh "$APP_STATUS_FILE"

          retry gh release upload app-status "$APP_STATUS_FILE" "$APP_STATUS_FILE.sig" --repo "${{ github.repository }}" --clobber

  # Ripubblica app-status.json ricostruito dai sorgenti del tag della versione rilasciata (v<versionName>
  # di main), con publishedAt nuovo e firmato: per un file caricato prima che si firmasse, che le build
  # recenti rifiutano. Mai firmare il file online cosi' com'e': un asset manomesso diventerebbe firmato.
  # Il catalogo dei modelli e' quello del tag, non di main: le app rilasciate verificano i download con
  # gli sha256 del loro APK.
  resign-app-status:
    if: github.event_name == 'workflow_dispatch' && inputs.resign_app_status && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-apk
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Ricostruisci, firma e ripubblica app-status.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          source .github/scripts/retry.sh
          TAG="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          git show "$TAG:app/build.gradle.kts" > "$RUNNER_TEMP/build.gradle.kts"
          git show "$TAG:feature/ai/src/main/kotlin/com/pockettravel/feature/ai/LlmModelCatalog.kt" > "$RUNNER_TEMP/LlmModelCatalog.kt"
          VERSION="$(grep -oP 'versionName = "\K[^"]+' "$RUNNER_TEMP/build.gradle.kts")"
          VERSION_CODE="$(grep -oP 'versionCode = \K[0-9]+' "$RUNNER_TEMP/build.gradle.kts")"
          APP_STATUS_FILE="$RUNNER_TEMP/app-status.json"
          AI_MODELS_FILE="$RUNNER_TEMP/ai-models.json"
          python3 scripts/generate_ai_models_manifest.py "$RUNNER_TEMP/LlmModelCatalog.kt" > "$AI_MODELS_FILE"
          jq -n \
            --arg versionName "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --slurpfile aiModels "$AI_MODELS_FILE" \
            --argjson publishedAt "$(date +%s)" \
            '{publishedAt: $publishedAt, appVersion: {versionName: $versionName, versionCode: $versionCode}, aiModels: $aiModels[0]}' \
            > "$APP_STATUS_FILE"
          bash .github/scripts/sign-files.sh "$APP_STATUS_FILE"
          retry gh release upload app-status "$APP_STATUS_FILE" "$APP_STATUS_FILE.sig" --repo "${{ github.repository }}" --clobber
