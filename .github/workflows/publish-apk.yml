name: Publish APK

# Builda un APK di release (mai debug, e mai come artifact di workflow) firmato con
# la upload key e lo pubblica come asset di una GitHub Release, taggata con
# versionName da app/build.gradle.kts.
# Su push a main parte solo se versionCode e' cambiato rispetto al commit precedente
# (vedi job check-version-bump) - un push senza bump di versione non deve ripubblicare
# la stessa release. workflow_dispatch resta un modo per forzare comunque una
# ripubblicazione (es. per rigenerare un asset corrotto) senza dover fare un bump finto.
#
# Pubblica anche app-status.json (versione app + modello IA on-device correnti) sulla release
# fissa "app-status": il controllo aggiornamenti sul device (core:sync/AppUpdateCheckWorker,
# feature:ai/LlmModelUpdateCheckWorker) lo legge da li', volutamente separato da manifest.json
# (pacchetti regionali, publish-regions.yml) — versione app/modello cambiano solo con un
# rilascio, mai insieme all'aggiornamento dati regionali.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version-bump:
    runs-on: ubuntu-24.04
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - id: check
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Confronto con il commit prima del push (non HEAD~1): un push di piu' commit con il bump
          # in uno intermedio va comunque pubblicato. HEAD~1 solo se manca (primo push del ramo,
          # SHA tutto zeri) o non e' piu' raggiungibile (force push).
          BASE="${BEFORE_SHA:-}"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          CURRENT="$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)"
          PREVIOUS="$(git show "$BASE:app/build.gradle.kts" 2>/dev/null | grep -oP 'versionCode = \K[0-9]+' || echo 0)"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: check-version-bump
    # Solo da main: un workflow_dispatch lanciato da un altro ramo non deve pubblicare release ne'
    # app-status.json.
    if: needs.check-version-bump.outputs.bumped == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Decodifica il keystore di firma
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK di release firmato
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon

      - name: Pubblica la release su GitHub
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          TAG="v$VERSION"
          APK="app/build/outputs/apk/release/app-release.apk"
          CHANGELOG_URL="https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          # Estrae solo la sezione di questa versione da CHANGELOG.md (dal suo "## [VERSION]"
          # alla prossima intestazione "## [", esclusa), cosi' le note della release non
          # duplicano a mano un testo che va tenuto sincronizzato in un solo posto.
          SECTION="$(awk -v ver="## [$VERSION]" '
            $0 == ver { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          # Sezione assente o vuota: una release senza note si scopre solo dopo, meglio fermarsi.
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            echo "Nessuna voce \"## [$VERSION]\" (o voce vuota) in CHANGELOG.md: aggiungerla prima di pubblicare" >&2
            exit 1
          fi
          {
            echo "Changelog completo: $CHANGELOG_URL"
            echo ""
            printf '%s\n' "$SECTION"
          } > "$NOTES_FILE"

          # Un rilancio dello stesso workflow sulla stessa VERSION (es. per correggere un
          # problema nell'APK appena caricato) deve poter riusare la release gia' creata
          # invece di fallire su "release already exists".
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "Pocket Travel $VERSION" \
              --notes-file "$NOTES_FILE"
          fi
          gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber

      - name: Pubblica app-status.json (controllo aggiornamenti app/modelli IA sul device)
        shell: bash
        run: |
          set -euo pipefail
          # Release fissa "app-status" (stesso pattern di "region-data" in publish-regions.yml),
          # non GitHub Pages: appVersion/aiModels devono cambiare solo con un rilascio app, mai
          # insieme all'aggiornamento (settimanale/manuale) dei pacchetti regionali su Pages -
          # vedi SyncConfig.APP_STATUS_URL (core:sync).
          gh release view app-status --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create app-status --repo "${{ github.repository }}" \
              --title "Stato app" \
              --notes "app-status.json: versione app e modelli IA on-device correnti, letti da core:sync/AppUpdateCheckWorker e feature:ai/LlmModelUpdateCheckWorker. Non e' una release software."

          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          VERSION_CODE="$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)"

          APP_STATUS_FILE="$RUNNER_TEMP/app-status.json"
          AI_MODELS_FILE="$RUNNER_TEMP/ai-models.json"

          # Un jq/grep sul singolo AiModelConfig bastava per un modello solo; con LlmModelCatalog
          # (una lista di LlmModelDefinition, una entry per modello) serve un parser vero - vedi
          # scripts/generate_ai_models_manifest.py per il perche' non e' inline qui (heredoc
          # bash e indentazione block scalar YAML sono incompatibili in questo caso).
          python3 scripts/generate_ai_models_manifest.py \
            "feature/ai/src/main/kotlin/com/pockettravel/feature/ai/LlmModelCatalog.kt" \
            > "$AI_MODELS_FILE"

          jq -n \
            --arg versionName "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --slurpfile aiModels "$AI_MODELS_FILE" \
            '{appVersion: {versionName: $versionName, versionCode: $versionCode}, aiModels: $aiModels[0]}' \
            > "$APP_STATUS_FILE"

          gh release upload app-status "$APP_STATUS_FILE" --repo "${{ github.repository }}" --clobber
