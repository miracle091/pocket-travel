name: Report settimanale publish-regions

# Riepilogo settimanale (non monitoraggio in tempo reale) delle run di publish-regions.yml
# dell'ultima settimana: esito di ognuna e, per quelle fallite, lo step su cui si sono fermate.
# Apre una issue con il riepilogo - nessun canale esterno (Slack/email) e' configurato in
# questo progetto, una issue e' il modo nativo GitHub di notificare senza aggiungere
# infrastruttura in piu'.
on:
  schedule:
    - cron: '0 0 * * 1' # lunedi 00:00 UTC = domenica 24:00 (come richiesto)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Raccogli le run dell'ultima settimana e apri la issue di riepilogo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SINCE_EPOCH="$(date -u -d '-7 days' +%s)"
          RUNS_JSON="$(gh run list --repo "$REPO" --workflow publish-regions.yml --limit 50 --json databaseId,conclusion,createdAt,headSha)"

          BODY="## Run di \`publish-regions.yml\` nell'ultima settimana"$'\n\n'
          COUNT=0

          while IFS= read -r run; do
            createdAt="$(jq -r .createdAt <<< "$run")"
            createdEpoch="$(date -u -d "$createdAt" +%s)"
            [ "$createdEpoch" -lt "$SINCE_EPOCH" ] && continue
            COUNT=$((COUNT + 1))

            id="$(jq -r .databaseId <<< "$run")"
            conclusion="$(jq -r '.conclusion // "in_progress"' <<< "$run")"
            sha="$(jq -r .headSha <<< "$run" | cut -c1-7)"
            url="https://github.com/$REPO/actions/runs/$id"

            case "$conclusion" in
              success) icon="✅" ;;
              failure) icon="❌" ;;
              *) icon="⏳" ;;
            esac

            BODY="$BODY- $icon [$createdAt]($url) — commit \`$sha\` — $conclusion"$'\n'

            if [ "$conclusion" = "failure" ]; then
              failedStep="$(gh run view "$id" --repo "$REPO" --json jobs --jq '[.jobs[].steps[] | select(.conclusion == "failure")][0].name // "sconosciuto"' 2>/dev/null || echo "sconosciuto")"
              BODY="$BODY  - fallito allo step: $failedStep"$'\n'
            fi
          done < <(jq -c '.[]' <<< "$RUNS_JSON")

          if [ "$COUNT" -eq 0 ]; then
            BODY="${BODY}Nessuna run in questa finestra di 7 giorni."$'\n'
          fi

          gh issue create --repo "$REPO" \
            --title "Report settimanale publish-regions — $(date -u +%Y-%m-%d)" \
            --body "$BODY"
