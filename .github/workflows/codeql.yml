name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analisi ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        if: matrix.language == 'java-kotlin'

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # Il Kotlin va compilato per essere analizzato: con build-mode "none" CodeQL lo
      # salta in silenzio e guarda solo il Java. Per il C/C++ vale l'opposto — senza
      # build il filtro paths-ignore ha effetto e llama.cpp resta fuori.
      - name: Compila per l'estrazione del Kotlin
        if: matrix.language == 'java-kotlin'
        run: ./gradlew assembleDebug --no-daemon

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
