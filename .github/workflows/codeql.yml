name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analisi ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Manca java-kotlin: l'estrattore Kotlin di CodeQL rifiuta la 2.4.20 del
        # progetto ("Kotlin version 2.4.20 is too recent") e fa fallire la
        # compilazione, mentre senza build resterebbe fuori comunque perché salta il
        # Kotlin in silenzio. Analizzabile sarebbe solo il Java, che qui esiste unicamente
        # in third-party/brouter-core ed è escluso. Da rimettere quando un bundle CodeQL
        # supporterà la versione di Kotlin in gradle/libs.versions.toml.
        language: [actions, c-cpp, python]
    steps:
      - uses: actions/checkout@v5

      # build-mode none non è solo più economico: è la condizione perché paths-ignore
      # abbia effetto sul C/C++, che altrimenti verrebbe analizzato per intero, llama.cpp
      # compreso.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
