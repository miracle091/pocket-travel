org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# KSP 2.1.0-1.0.29 registra ancora le directory generate via kotlin.sourceSets, DSL
# disabilitata da AGP 9 con il Kotlin integrato. Manteniamo il workaround finche' KSP
# non pubblica una versione compatibile.
android.disallowKotlinSourceSets=false
# Silenzia il warning "experimental option" che Android Studio mostra per il flag sopra.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
org.gradle.configuration-cache=true

# Dipendenze in CI: timeout e nuovi tentativi piu' larghi dei default di Gradle (30 s, 3 tentativi),
# perche' un repository lento o un errore passeggero non faccia fallire una build.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
