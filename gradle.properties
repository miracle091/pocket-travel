org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Sincronizzazione parallela (Gradle 9.4+)
org.gradle.tooling.parallel=true

org.gradle.configuration-cache=true
# Build cache: i task con gli stessi input riusano l'output (in CI la cartella di Gradle la salva setup-gradle).
org.gradle.caching=true

# KSP non incrementale: in locale le build incrementali a volte perdevano il codice generato da Hilt in feature/vault
# (google/ksp#3286, due task KSP nella stessa build si svuotano la cache a vicenda). Da togliere con la release di KSP che
# contiene la correzione (google/ksp#3294).
ksp.incremental=false

# Dipendenze in CI: timeout e nuovi tentativi piu' larghi dei default di Gradle (30 s, 3 tentativi),
# perche' un repository lento o un errore passeggero non faccia fallire una build.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
